site_name: {{project_name}}
site_url: https://{{github_username}}.github.io/{{project_name}}/
repo_url: https://github.com/{{github_username}}/{{project_name}}
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.tabs
    - navigation.sections
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
      toc_depth: 3

# nav: maintained by doc-keeper agent based on filesystem
nav:
  - Home: index.md
  - Architecture: architecture/overview.md
  - ADRs:
      - adr/index.md
  - Runbooks:
      - runbooks/index.md
      - Deploy: runbooks/deploy.md
      - Rollback: runbooks/rollback.md
      - Incident response: runbooks/incident-response.md
      - Secret leak: runbooks/secret-leak.md
      - IaC recovery: runbooks/iac-recover.md
  - API: api/index.md

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/{{github_username}}/{{project_name}}
