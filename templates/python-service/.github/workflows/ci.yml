name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Path filters per ADR-0007 performance discipline
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  ci:
    uses: {{github_username}}/agentic-dev-environment/.github/workflows/ci-python.yml@main
    with:
      python-version: "3.12"
      coverage-fail-under: 80
    secrets:
      sentry-dsn: ${{ secrets.SENTRY_DSN }}

  ai-review:
    if: github.event_name == 'pull_request'
    uses: {{github_username}}/agentic-dev-environment/.github/workflows/claude-pr-review.yml@main
    secrets: inherit

  security-scan:
    uses: {{github_username}}/agentic-dev-environment/.github/workflows/security-scan.yml@main
    secrets: inherit
