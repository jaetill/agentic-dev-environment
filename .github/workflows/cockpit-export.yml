name: cockpit-export
# Re-exports live Grafana dashboard → infra/ops-cockpit/dashboard.json daily
# and OPENS A PR with any drift (does NOT push directly to main — branch
# protection respects GITHUB_TOKEN writes; per code-review #313 and security-
# review #312).
#
# This is the SAFETY NET, not the primary mechanism. The primary mechanism is
# the agent-contract rule: any agent that edits the live cockpit via API or UI
# MUST re-export to dashboard.json in the SAME change. (Codified in
# docs/runbooks/ops-cockpit.md and the intake-steward / cockpit-related
# agent contracts.)
#
# Why a safety net is still needed: if an agent edits live and forgets the
# re-export, the file drifts. The drift was the root cause of the 2026-06-06
# 'cockpit changes stuck' incident — 65-panel gap between v34 file and v55
# live. This workflow guarantees drift can never outlive a day, and routes
# the correction through review so a compromised GRAFANA_API_KEY can't land
# arbitrary JSON on main unreviewed.
#
# Direction: live → file. The COMPANION workflow cockpit-apply.yml runs the
# OTHER direction (file → live) on push to main. Together: round-trip
# consistency through the normal PR gate.
#
# Required secrets (same as cockpit-apply.yml):
#   - GRAFANA_URL
#   - GRAFANA_API_KEY

on:
  schedule:
    # Daily at 10:00 UTC (04:00 / 05:00 America/Chicago — outside both
    # autonomous loop windows so commits don't collide with implementer work).
    - cron: '0 10 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cockpit-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Export live → dashboard.json
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_API_KEY: ${{ secrets.GRAFANA_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${GRAFANA_URL:-}" ] || [ -z "${GRAFANA_API_KEY:-}" ]; then
            echo "::warning::GRAFANA_URL / GRAFANA_API_KEY not set; skipping export"
            exit 0
          fi

          # Pin GRAFANA_URL to a strict https://<stack>.grafana.net pattern so
          # a compromised-secret actor can't redirect curl -L at internal
          # endpoints — per security-review #314. Bash `case` globs match `/`
          # (security-review #318) so use a regex anchor with a constrained
          # hostname character class.
          if [[ ! "$GRAFANA_URL" =~ ^https://[a-z0-9-]+\.grafana\.net$ ]]; then
            echo "::error::GRAFANA_URL must match https://<stack>.grafana.net with no path (got: $GRAFANA_URL); refusing to run"
            exit 1
          fi

          live=$(curl -sfL \
            -H "Authorization: Bearer $GRAFANA_API_KEY" \
            "$GRAFANA_URL/api/dashboards/uid/ops-cockpit")

          # Strip id + version (provider manages them); keep uid. Pretty-print.
          # Matches the export recipe in HANDOFF.md and the User-env tofu apply
          # path so a manual apply downstream sees no churn.
          echo "$live" \
            | jq '.dashboard | del(.id, .version) | .uid = "ops-cockpit"' \
            > infra/ops-cockpit/dashboard.json

          # Schema sanity check — refuse to commit a structurally broken file
          # (defense against a compromised GRAFANA_API_KEY pushing garbage
          # through this write path; per security-review #312).
          jq -e \
            '.uid == "ops-cockpit" and has("panels") and (.panels | type == "array" and length > 0)' \
            infra/ops-cockpit/dashboard.json > /dev/null || {
              echo "::error::exported dashboard.json failed schema sanity check (missing/empty panels or wrong uid); aborting"
              exit 1
            }

          echo "live version: $(echo "$live" | jq -r '.dashboard.version')"
          echo "panel count: $(jq '.panels | length' infra/ops-cockpit/dashboard.json)"

      - name: Open drift-correction PR if any
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git diff --quiet infra/ops-cockpit/dashboard.json; then
            echo "no drift; nothing to commit"
            echo "## Cockpit export clean" >> "$GITHUB_STEP_SUMMARY"
            echo "Live dashboard matches infra/ops-cockpit/dashboard.json." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          stat_line=$(git diff --stat infra/ops-cockpit/dashboard.json | tail -1)
          echo "drift detected: $stat_line"

          branch="chore/cockpit-drift-$(date +%Y%m%d)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add infra/ops-cockpit/dashboard.json
          git commit -m "chore(cockpit): re-export live → dashboard.json (drift sweep)

          Caught by the daily cockpit-export safety net. An agent edited the live
          cockpit but didn't round-trip to Terraform in the same change (rule:
          feedback_grafana_live_edit_must_update_tf). This PR closes the gap.

          If you didn't expect drift, check recent live edits via the Grafana
          audit log."
          # --force-with-lease so a same-day re-run (workflow_dispatch retry,
          # cron-vs-dispatch race) overwrites the prior draft commit cleanly
          # instead of failing the non-fast-forward push - per code-review #317.
          git push --force-with-lease -u origin "$branch"

          # Reuse an existing open drift PR if one already targets the same
          # daily branch (idempotent — rerunning the workflow doesn't open
          # duplicates).
          # `// empty` so an empty PR list yields "" not the string "null" (#320),
          # which would otherwise look like an existing PR and skip creation.
          existing=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty' || true)
          if [ -n "$existing" ]; then
            echo "drift PR already open: #$existing — updated branch in place"
            url="https://github.com/${GITHUB_REPOSITORY}/pull/$existing"
          else
            # Surface a create failure loudly (#321) — drift must not be silently dropped.
            if ! url=$(gh pr create \
              --title "chore(cockpit): drift sweep ($(date +%Y-%m-%d))" \
              --body "Auto-generated by cockpit-export.yml. An agent edited the live cockpit without round-tripping to dashboard.json. Drift detected: \`$stat_line\`. Review the diff; if it reflects the intended live state, merge to re-converge." \
              --label "scope:ci"); then
              echo "::error::Cockpit drift detected but 'gh pr create' failed — drift PR NOT opened."
              exit 1
            fi
          fi

          echo "## Cockpit drift PR opened" >> "$GITHUB_STEP_SUMMARY"
          echo "- $stat_line" >> "$GITHUB_STEP_SUMMARY"
          echo "- $url" >> "$GITHUB_STEP_SUMMARY"
