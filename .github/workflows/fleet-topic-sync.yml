name: fleet-topic-sync
# Reconcile the DERIVED `fleet` repo topic to match the system of record,
# fleet/repos.txt (ADR-0051, #555). The manifest is authoritative for fleet
# membership and capability; the topic is a cosmetic projection used only by
# dashboards / `gh search`. This workflow runs the best-effort reconciler on
# every change to the manifest (and on demand).
#
# IMPORTANT — full auto-sync requires the fleet App to have Administration
# (write) on the target repos so it can edit repo topics. If it does NOT, this
# run WARNS (the reconciler never fails on a topic-write error — the topic is
# cosmetic) and the topic must be reconciled manually. We deliberately do NOT
# grant the fleet App repo-admin in this PR: broadening the App's scope to
# settings-write would widen the loop's blast radius — exactly the trust-boundary
# expansion #555 set out to avoid. A stale topic is harmless; an over-scoped App
# token is not.

on:
  push:
    branches: [main]
    paths:
      - 'fleet/repos.txt'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fleet-topic-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4   # for fleet/repos.txt + scripts/fleet-topic-sync.sh

      - name: Mint fleet App token
        id: fleet-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Reconcile derived `fleet` topic to the manifest
        # The reconciler exits 0 even when topic writes are unauthorized (it
        # warns instead), so the job does not fail on a cosmetic-topic blip.
        env:
          GH_TOKEN: ${{ steps.fleet-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: bash "$GITHUB_WORKSPACE/scripts/fleet-topic-sync.sh"
