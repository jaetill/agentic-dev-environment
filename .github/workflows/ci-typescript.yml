name: ci-typescript (reusable)
# Reusable TypeScript/Node CI per Standard 02 / ADR-0003.
# Runs: lint, type-check, format-check, security audit, tests with tiered coverage, build.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "20"
      pnpm-version:
        type: string
        default: "9"
      coverage-fail-under:
        type: number
        default: 80
    secrets:
      sentry-dsn:
        required: false
      sentry-auth-token:
        required: false
      codecov-token:
        required: false

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Prettier check
        run: pnpm format:check
      - name: ESLint
        run: pnpm lint
      - name: TypeScript typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: pnpm test:coverage
      - name: Upload coverage
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.codecov-token }}
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "pnpm"
      - name: pnpm audit
        run: pnpm audit --audit-level moderate
        continue-on-error: false   # block on moderate+ findings

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.sentry-dsn }}
          SENTRY_AUTH_TOKEN: ${{ secrets.sentry-auth-token }}
        run: pnpm build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 7
