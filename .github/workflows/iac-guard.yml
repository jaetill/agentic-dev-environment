name: iac-additive-guard (reusable)
# ADR-0035: the deterministic safe-additive IaC guard, run as an independent PR
# check. A caller in an app repo wires this on `pull_request` for scope:iac PRs;
# the central auto-merge gate (triage-scan.yml) requires this check passing before
# an IaC PR may auto-merge (and thus auto-apply on dev). Writer != approver: the
# verdict is a script over machine-emitted `tofu show -json` output, never the
# implementer agent's self-assessment.
on:
  workflow_call:
    inputs:
      tf-dir:
        type: string
        required: false
        default: terraform/envs/prod  # the env the iac-implementer plans
      platform-ref:
        type: string
        required: false
        default: main                 # pin the guard script version
      aws-region:
        type: string
        required: false
        default: us-east-2
    secrets:
      aws-role-arn:
        required: true                # read-only role; the guard only plans
      extra-tf-env:
        # Optional newline-separated KEY=VALUE pairs exported into the plan
        # environment — for root modules that require variables deliberately
        # kept out of source (e.g. game-night-pwa's TF_VAR_grafana_external_id).
        # Values live in the caller repo's secrets and are masked in logs.
        required: false

permissions:
  contents: read
  id-token: write   # AWS OIDC
  checks: read

jobs:
  iac-additive-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR head (caller repo)
        uses: actions/checkout@v4

      - name: Checkout platform guard script
        uses: actions/checkout@v4
        with:
          repository: jaetill/agentic-dev-environment
          ref: ${{ inputs.platform-ref }}
          path: .platform
          sparse-checkout: scripts/iac-auto-merge-guard.sh
          sparse-checkout-cone-mode: false

      - uses: opentofu/setup-opentofu@v1

      - name: Configure AWS credentials (read-only)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Plan and classify
        # Any failure to produce or classify a plan -> non-zero -> red check ->
        # the gate holds the PR for a human. Fail-safe by construction.
        env:
          EXTRA_TF_ENV: ${{ secrets.extra-tf-env }}
        run: |
          set -euo pipefail
          # Export caller-supplied environment (TF_VAR_* a root module requires
          # but keeps out of source). Actions masks the whole `extra-tf-env`
          # SECRET blob, but NOT the individual values parsed out of it — once
          # split, a value is no longer in the redaction list and could surface
          # in `tofu plan` diffs or error output. So register each parsed value
          # with ::add-mask:: before exporting it.
          # NB: explicit if, not `[[ ... ]] && continue` — under set -e a
          # false test in that idiom returns 1 as the statement's exit code
          # and kills the shell on every VALID line (game-night#168's first
          # guard run died here silently).
          if [[ -n "${EXTRA_TF_ENV:-}" ]]; then
            while IFS= read -r kv; do
              if [[ -n "$kv" && "$kv" == *=* ]]; then
                # Allowlist the TF_VAR_ namespace only (#278). Without this, a
                # caller (or compromised caller) could inject TF_CLI_ARGS_plan=
                # -destroy / -target=, AWS_ACCESS_KEY_ID/SECRET overrides, or
                # PATH to redirect the plan away from the real changeset and
                # defeat the writer≠approver invariant. Reject anything else.
                key="${kv%%=*}"
                if [[ ! "$key" =~ ^TF_VAR_[A-Za-z0-9_]+$ ]]; then
                  echo "::warning::extra-tf-env: rejecting non-TF_VAR_ key '${key}'"
                  continue
                fi
                val="${kv#*=}"
                [[ -n "$val" ]] && echo "::add-mask::$val"
                export "${kv?}"
              fi
            done <<< "$EXTRA_TF_ENV"
          fi
          cd "${{ inputs.tf-dir }}"
          tofu init -input=false
          tofu plan -input=false -lock=false -out=tfplan
          tofu show -json tfplan > plan.json
          bash "${GITHUB_WORKSPACE}/.platform/scripts/iac-auto-merge-guard.sh" plan.json
