name: claude-implementer
# Phase B of ADR-0026 — invokes the implementer agent in one of two modes:
#
# Mode A (initial implementation): triggered either when the repo OWNER opens
#   an issue labelled `bug`/`defect`/`feature-request` (the owner's own work —
#   picked up at once, bypassing the promoter and window per ADR-0017; the
#   `author_association == 'OWNER'` guard is required because this repo is
#   PUBLIC and ships templates that auto-apply those labels, so without it any
#   GitHub user could start an implementer run on the platform repo — ADR-0025), or
#   when an issue gains a pickup label (`ready-for-implementer`,
#   `source:sentry`, `severity:critical`, `plan-approved`).
#   Features build by default (ADR-0033): a `feature-request` goes straight to
#   the BUILD PHASE like a `defect`/`bug`. The two-phase plan-gate (PLAN PHASE
#   posts an approach and waits for the human's `plan-approved`, then BUILD)
#   runs only when the human opts in with the `plan-first` label.
#
# Mode B (fix iteration): triggered when a PR authored by claude[bot]
#   receives a review with state REQUEST_CHANGES from code-reviewer or
#   security-reviewer (i.e. our gate steps failed). Agent reads feedback,
#   addresses each finding, pushes a new commit to the same branch.
#
# Hard guardrails (per ADR-0026):
#   - 50 LOC / 3 files / 1 component scope cap (enforced in agent prompt)
#   - Max 3 fix-iteration attempts before escalation
#   - Daily activation cap (TODO: enforce in workflow)
#   - Never commits to master (enforced by branch protection + agent prompt)
#   - Never modifies terraform/ (iac-implementer handles those)

on:
  issues:
    types: [opened, labeled]
  # Fix-iteration trigger: when a reviewer comment containing "VERDICT: BLOCK"
  # lands on a PR. Per issue #24, our reviewer agents post issue comments
  # (not formal PR reviews), so pull_request_review never fires.
  # issue_comment fires for both issue AND PR comments — the fix-iteration
  # job filters to PR comments only.
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to implement (for manual dispatch / fleet promoter)'
        required: false
        type: string
      mode:
        description: 'cleanup-sweep = drain deferred nits only (fleet promoter spare-capacity, ADR-0020)'
        required: false
        type: string
      bundle_issues:
        description: 'Comma-separated deferred-until-adjacent nit issue numbers the promoter selected to ride along with issue_number (same-file, ADR-0029)'
        required: false
        type: string

permissions:
  contents: write       # branch creation + push
  pull-requests: write  # PR creation
  issues: write         # commenting on the issue
  id-token: write       # claude-code-action OIDC

# Cancel previous runs for the same issue; if a new label triggers a re-run,
# the older one's work is stale.
concurrency:
  group: implementer-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false   # don't kill mid-implementation

jobs:
  # ── Mode A: initial implementation (feature plan-gate continuation only) ──
  # Per ADR-0030 the bypass triggers moved to the promoter's event-dispatch
  # (triage-scan.yml). The ADR-0025 OWNER guard and the source:sentry /
  # severity:critical / human ready-for-implementer triggers now live there.
  initial:
    # ADR-0030: all initial dispatch now routes through the promoter's
    # event-dispatch (triage-scan.yml). The bypass triggers — source:sentry,
    # severity:critical, human-applied ready-for-implementer, and owner-opened
    # bug/defect/feature-request — were REMOVED from here and moved there
    # (deterministic, throttled). What remains is the feature plan-gate
    # continuation: a human applying plan-approved re-enters the BUILD phase
    # for a plan-first feature (ADR-0033). The promoter dispatches all
    # other Mode-A work via workflow_dispatch (the manual-dispatch job).
    if: |
      github.event_name == 'issues'
      && github.event.action == 'labeled'
      && !contains(github.event.issue.labels.*.name, 'scope:iac')
      && github.event.label.name == 'plan-approved'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use GITHUB_TOKEN for push permissions (already write per
          # workflow-level permissions block).
          token: ${{ secrets.IMPLEMENTER_PAT || secrets.GITHUB_TOKEN }}
      # Node setup + install only when this repo is actually a Node project.
      # The platform repo itself has no root package.json; unconditionally
      # running setup-node (cache: npm) or `npm ci` fails there.
      - name: Detect Node project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No root package.json — skipping Node setup."
          fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.node == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.detect.outputs.node == 'true'
        run: |
          npm ci
          [ -f lambda/package-lock.json ] && npm ci --prefix lambda || echo "no lambda deps"
      - name: Configure git author
        run: |
          git config user.name 'claude[bot]'
          git config user.email '41898282+claude[bot]@users.noreply.github.com'
      - name: Run implementer agent (Mode A — initial)
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            Act as the `implementer` subagent (see .claude/agents/implementer.md).
            You are operating in **Mode A**.

            The work item is issue #${{ github.event.issue.number }}.

            Read the issue FIRST, including its labels:
              gh issue view ${{ github.event.issue.number }} --json title,body,labels,comments

            ## Step 0 — Competence gate (process-flaw issues, ADR-0019)

            If this issue is a process flaw — it carries the `process-flaw`
            label, or its fix lives in `ai-team` (an agent definition, a
            reusable workflow, a platform standard, a shared template) —
            classify it per docs/standards/12-self-modification.md before
            doing anything else:

            - MECHANICAL — a permission, a typo, a missing tool grant, or
              applying a pattern the team already uses elsewhere → proceed
              through the build phase below.
            - COMPOSITIONAL / STANDARDS / SECURITY-touching — it changes
              the agent roster, what a role does, a gate, a review, a
              standard, or the security posture → do NOT implement it.
              Post an issue comment naming the classification and
              recommending the architect path (research authoritative best
              practice, propose an ADR with tradeoffs, human ratifies),
              then STOP.

            When you cannot confidently call a self-change mechanical,
            treat it as compositional and stop. An unmade self-change is
            recoverable; an improvised one is not.

            A `process-flaw` pulled from a single project is n=1 — do NOT
            assume its fix fits every project. If the flaw or its proposed
            fix is shaped by that project's stack or codebase, treat it as
            compositional and route it to the architect for a generality
            assessment (Standard 12): general flaw, project-local, or
            general flaw needing a generalized fix.

            ## Step 1 — Determine the phase (feature plan-gate, ADR-0017)

            Inspect the labels:

            - If the issue has `feature-request` AND `plan-first` AND not yet
              `plan-approved` → you are in the **PLAN PHASE** (ADR-0033 opt-in).
            - Otherwise (a `defect`/`bug`, a `feature-request` WITHOUT
              `plan-first`, or a `plan-first` feature that now has
              `plan-approved`) → you are in the **BUILD PHASE**. Features build
              by default; the plan phase is opt-in via `plan-first`.

            ### PLAN PHASE — do this and nothing else:
              1. Read the issue body in full; read enough surrounding code to
                 propose a concrete approach.
              2. Check the scope cap (>50 LOC, >3 files, cross-component). If
                 the feature plainly exceeds it, post the scope-cap refusal
                 comment and stop.
              3. Post your intended approach as an issue comment
                 (`gh issue comment`): what you will change, which files, the
                 solution shape, what you will test, what you are explicitly
                 NOT doing. Keep it skimmable.
              4. `gh issue edit ${{ github.event.issue.number }} --add-label awaiting-plan-approval`
              5. STOP. Do not create a branch. Do not write code. The human
                 applies `plan-approved` when satisfied, which re-triggers
                 this workflow into the build phase.

            ### BUILD PHASE — follow your spec's Mode A process exactly:
              1. Read the issue body in full. For a feature, also re-read your
                 own approved approach comment and implement THAT.
              2. Check the scope cap (>50 LOC, >3 files, cross-component).
                 If exceeded, post the refusal comment and stop.
              3. Read the relevant code in context.
              4. Plan the minimal change.
              5. Create branch `impl/<slug>-${{ github.event.issue.number }}`.
              6. Write the code change.
              7. Write tests that would fail without the fix.
              8. Run `npm test`, `npm run lint`, `npm run typecheck` (if defined).
              9. Iterate locally until clean.
             10. Commit (SSH-signed via the git config from earlier; the
                 runner has the GitHub App's signing identity).
             11. **Pre-flight conflict check** (per spec step 11, issue #29).
                 `git fetch origin master && git rebase origin/master`. If
                 the rebase succeeds, your branch is up-to-date with master
                 — continue. If it fails with conflicts, `git rebase --abort`,
                 post an explanatory comment on the issue, and EXIT WITHOUT
                 PUSHING. The ready-for-implementer label remains; the human
                 (or a future dispatch) will retry once the conflicting PR
                 has settled. This prevents the parallel-dispatch failure
                 mode we hit on PRs #26/#27.
             12. Push the branch.
             13. Open a PR with title `<type>(<component>): <description>`
                 and the body sections from your spec (What changed / Why /
                 How tested / Closes #${{ github.event.issue.number }}).
             14. Stop.

            Hard rules:
              - Never commit to master.
              - Never modify terraform/ (that's iac-implementer).
              - Never modify .github/workflows/ unless the issue has `scope:ci`.
              - Never apply `plan-approved` yourself — that is the human's gate.
              - If at any point you cannot proceed safely, post a comment
                on the issue explaining and stop. Do not push broken code.
          claude_args: |
            --model claude-sonnet-4-6
            --permission-mode bypassPermissions
            --allowed-tools Bash,Read,Write,Edit,Glob,Grep
            --append-system-prompt "Follow the platform standards in docs/standards/. Adhere strictly to the implementer agent's scope cap and authority rules per .claude/agents/implementer.md."

  # ── Mode A: IaC implementation (separate agent) ─────────────────────────
  initial-iac:
    if: |
      github.event_name == 'issues'
      && contains(github.event.issue.labels.*.name, 'scope:iac')
      && (
        (
          github.event.action == 'labeled'
          && github.event.label.name == 'ready-for-implementer'
          && github.event.sender.type != 'Bot'
        )
        || (
          github.event.action == 'opened'
          && github.event.issue.user.type != 'Bot'
          && github.event.issue.author_association == 'OWNER'
          && (
            contains(github.event.issue.labels.*.name, 'bug')
            || contains(github.event.issue.labels.*.name, 'defect')
            || contains(github.event.issue.labels.*.name, 'feature-request')
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.IMPLEMENTER_PAT || secrets.GITHUB_TOKEN }}
      - uses: opentofu/setup-opentofu@v1
      - name: Configure AWS credentials (read-only iac-drift role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::214599503944:role/game-night-iac-drift
          aws-region: us-east-2
      - name: Configure git author
        run: |
          git config user.name 'claude[bot]'
          git config user.email '41898282+claude[bot]@users.noreply.github.com'
      - name: Run iac-implementer agent
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            Act as the `iac-implementer` subagent (.claude/agents/iac-implementer.md).
            You are operating in **Mode A — initial IaC implementation**.

            Work item: issue #${{ github.event.issue.number }} with label `scope:iac`.

            Read the issue:
              gh issue view ${{ github.event.issue.number }} --json title,body,labels

            Follow your spec's Mode A process exactly. Critical rules:
              - cd terraform/envs/prod
              - Run `tofu init`, `tofu validate`, `tofu plan`
              - NEVER run `tofu apply` or `tofu destroy`
              - NEVER modify state directly
              - Open the PR with the full `tofu plan` output in the body
              - If destructive-change-detector would flag this change, check
                for a paired Accepted ADR; if none, post a comment and stop.
              - Scope cap: max 5 resources per PR.

            After opening the PR, stop. A human runs `tofu apply` after
            merge.
          claude_args: |
            --model claude-sonnet-4-6
            --permission-mode bypassPermissions
            --allowed-tools Bash,Read,Write,Edit,Glob,Grep
            --append-system-prompt "Follow the platform standards in docs/standards/. Adhere strictly to the iac-implementer agent's scope cap and authority rules per .claude/agents/iac-implementer.md."

  # ── Mode B: fix iteration ───────────────────────────────────────────────
  fix-iteration:
    # Triggered when a reviewer agent posts a comment containing
    # "VERDICT: BLOCK" on a PR authored by claude[bot]. Per issue #24,
    # our reviewer agents post issue comments (not formal PR reviews),
    # so we listen on issue_comment events and parse the body.
    #
    # Filters in order:
    #   1. Must be an issue_comment event (pull_request_review path retired)
    #   2. Must be on a PR (issue_comment fires for both issues and PRs;
    #      PR comments have pull_request set on the parent issue)
    #   3. Comment author must be claude[bot] (the reviewer)
    #   4. Comment body must contain "VERDICT: BLOCK"
    #   5. PR head branch must start with impl/ (implementer-authored PR)
    #
    # The 3-attempt cap (enforced in the agent prompt + workflow step
    # below) bounds the fix loop.
    # NB: removed the `startsWith(issue.title, 'fix(') == false` filter that
    # was here. The intent had been to prevent fix-iteration from re-entering
    # on already-in-flight fix PRs, but the effect was to exclude EVERY
    # Conventional-Commits-named PR (all of our PRs start with `fix(` or
    # `feat(`). Observed concretely on PR #58 on 2026-05-13: VERDICT: BLOCK
    # landed, fix-iteration didn't fire, the head agent had to do the fix
    # manually. The re-entry concern is already handled by the Resolve PR
    # head ref step below — only PRs whose head branch starts with `impl/`
    # qualify, and the 3-attempt cap downstream bounds the loop.
    if: |
      github.event_name == 'issue_comment'
      && github.event.action == 'created'
      && github.event.issue.pull_request != null
      && github.event.comment.user.login == 'claude[bot]'
      && contains(github.event.comment.body, 'VERDICT: BLOCK')
      && (
        startsWith(github.event.issue.pull_request.html_url, 'https://github.com/jaetill/agentic-dev-environment/pull/')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Resolve PR head ref
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          # issue_comment events don't give us the PR head ref directly.
          # Fetch it via the API. Also fetch the head branch — must start
          # with impl/ to qualify as an implementer-authored PR.
          pr_json=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}")
          head_ref=$(echo "$pr_json" | jq -r '.head.ref')
          head_user=$(echo "$pr_json" | jq -r '.user.login')
          if [[ ! "$head_ref" == impl/* ]]; then
            echo "::notice::PR head '$head_ref' is not an implementer branch (no impl/ prefix); skipping fix-iteration."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$head_user" != "claude[bot]" ]]; then
            echo "::notice::PR author '$head_user' is not claude[bot]; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.pr.outputs.skip != 'true'
        with:
          fetch-depth: 0
          ref: ${{ steps.pr.outputs.head_ref }}
          token: ${{ secrets.IMPLEMENTER_PAT || secrets.GITHUB_TOKEN }}
      - name: Detect Node project
        id: detect
        if: steps.pr.outputs.skip != 'true'
        run: |
          if [ -f package.json ]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No root package.json — skipping Node setup."
          fi
      - uses: actions/setup-node@v4
        if: steps.pr.outputs.skip != 'true' && steps.detect.outputs.node == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.pr.outputs.skip != 'true' && steps.detect.outputs.node == 'true'
        run: |
          npm ci
          [ -f lambda/package-lock.json ] && npm ci --prefix lambda || echo "no lambda deps"
      - name: Configure git author
        if: steps.pr.outputs.skip != 'true'
        run: |
          git config user.name 'claude[bot]'
          git config user.email '41898282+claude[bot]@users.noreply.github.com'
      - name: Count prior fix attempts on this branch
        id: count
        if: steps.pr.outputs.skip != 'true'
        run: |
          attempts=$(git log --author='claude\[bot\]' --grep='address review feedback' --oneline | wc -l)
          echo "attempts=$attempts" >> "$GITHUB_OUTPUT"
          echo "Prior fix attempts: $attempts"
      - name: Escalate if at cap
        if: steps.pr.outputs.skip != 'true' && steps.count.outputs.attempts >= '3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh pr comment ${PR_NUMBER} --body "I've made 3 attempts to address review feedback without converging. Escalating to @jaetill for direction. Stopping autonomous fix iteration per ADR-0026."
          exit 0
      - name: Run implementer agent (Mode B — fix)
        if: steps.pr.outputs.skip != 'true' && steps.count.outputs.attempts < '3'
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          allowed_bots: 'claude[bot]'
          prompt: |
            Act as the `implementer` subagent.
            You are operating in **Mode B — fix iteration**.

            PR: #${{ github.event.issue.number }}
            Head branch: ${{ steps.pr.outputs.head_ref }}
            Prior attempts on this branch: ${{ steps.count.outputs.attempts }}

            Read the latest reviewer comments:
              gh pr view ${{ github.event.issue.number }} --json comments

            Look specifically for the most recent comments starting with
            `## Code Review` and `## Security Review`. Each enumerates
            findings with severity. Address every Critical and High
            finding; address Medium findings if they're easy to fix in
            scope.

            Process:
              1. For each finding, read the file/line cited.
              2. Apply a minimal fix.
              3. Run npm test to verify nothing regresses.
              4. Commit with message:
                 `fix(<component>): address review feedback — <description>`
              5. **Pre-flight conflict check** (per spec step 11, issue
                 #29; equally applies to Mode B per #43). Run
                 `git fetch origin master && git rebase origin/master`.
                 Clean rebase = continue. Conflict = `git rebase --abort`,
                 post an explanatory comment on the PR
                 (`gh pr comment ${PR_NUMBER} --body "..."`), and EXIT
                 WITHOUT PUSHING. The PR remains open; once the conflicting
                 master change has settled, the next reviewer-block
                 comment will re-trigger this job.
              6. Push to the same branch.
              7. Post a brief comment on the PR listing one bullet per
                 finding with what you changed.

            Hard rules same as Mode A.
          claude_args: |
            --model claude-sonnet-4-6
            --permission-mode bypassPermissions
            --allowed-tools Bash,Read,Write,Edit,Glob,Grep
            --append-system-prompt "Follow the platform standards in docs/standards/. You are operating in Mode B per .claude/agents/implementer.md."

  # ── workflow_dispatch handler — fleet promoter dispatch (ADR-0020) ──────
  manual-dispatch:
    if: |
      github.event_name == 'workflow_dispatch'
      && inputs.issue_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.IMPLEMENTER_PAT || secrets.GITHUB_TOKEN }}
      - name: Detect Node project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No root package.json — skipping Node setup."
          fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.node == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.detect.outputs.node == 'true'
        run: |
          npm ci
          [ -f lambda/package-lock.json ] && npm ci --prefix lambda || echo "no lambda deps"
      - name: Configure git author
        run: |
          git config user.name 'claude[bot]'
          git config user.email '41898282+claude[bot]@users.noreply.github.com'
      - name: Run implementer agent (manual dispatch)
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The fleet promoter (ADR-0020) dispatches this workflow as the
          # GitHub App jaetill-ai-triage-team[bot] — a Bot actor.
          # claude-code-action rejects Bot-initiated runs unless the bot is
          # allow-listed. workflow_dispatch is itself permission-gated, so
          # allowing the fleet App here is safe.
          allowed_bots: 'jaetill-ai-triage-team[bot]'
          show_full_output: true
          prompt: |
            Dispatched implementation (Mode A) — fleet promoter (ADR-0020)
            or manual smoke test. Issue number from the workflow_dispatch input.

            Issue number: ${{ inputs.issue_number }}
            Promoter-selected adjacent nits to bundle: ${{ inputs.bundle_issues }}

            Follow the Mode A process from .claude/agents/implementer.md.

            ADJACENCY BUNDLE (ADR-0029): the promoter pre-selected the nit
            issue(s) listed above (same-file matches). Do NOT scan the queue
            for nits yourself. For each supplied nit, confirm its cited file is
            one your change ACTUALLY touched; if so, bundle it into this PR's
            "While here" section and `Closes #<nit>`. If a supplied nit is NOT
            in a file you touched, DROP it: do not close it, leave it
            `deferred-until-adjacent`, and — if you can determine the nit's
            actual current file from the code (e.g. a stale or renamed path) —
            edit that nit issue to correct its cited file:line so it is matched
            correctly next time; otherwise post a one-line note that it was
            evaluated with #${{ inputs.issue_number }} and was not adjacent.
          claude_args: |
            --model claude-sonnet-4-6
            --permission-mode bypassPermissions
            --allowed-tools Bash,Read,Write,Edit,Glob,Grep
            --append-system-prompt "Follow the platform standards in docs/standards/. Adhere strictly to .claude/agents/implementer.md."

  # ── Mode C: cleanup sweep (workflow_dispatch -f mode=cleanup-sweep) ──────
  # Dispatched by the fleet promoter's spare-capacity sweep (ADR-0020). No
  # originating issue — the implementer drains deferred-until-adjacent nits.
  cleanup-sweep:
    if: |
      github.event_name == 'workflow_dispatch'
      && inputs.mode == 'cleanup-sweep'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.IMPLEMENTER_PAT || secrets.GITHUB_TOKEN }}
      - name: Detect Node project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No root package.json — skipping Node setup."
          fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.node == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.detect.outputs.node == 'true'
        run: |
          npm ci
          [ -f lambda/package-lock.json ] && npm ci --prefix lambda || echo "no lambda deps"
      - name: Configure git author
        run: |
          git config user.name 'claude[bot]'
          git config user.email '41898282+claude[bot]@users.noreply.github.com'
      - name: Run implementer agent (Mode C — cleanup sweep)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Dispatched by the fleet promoter App — allow the Bot actor
          # (full rationale on the workflow_dispatch handler above).
          allowed_bots: 'jaetill-ai-triage-team[bot]'
          show_full_output: true
          prompt: |
            Act as the `implementer` subagent, operating in **Mode C — cleanup
            sweep** (see .claude/agents/implementer.md).

            There is no originating issue. Open sidecar cleanup PR(s) only:
            drain a bounded batch of this repo's open `deferred-until-adjacent`
            nit issues — cap max(floor(total / 2), 8), chunked at 12 issues per
            PR. Branch `cleanup/deferred-sweep-<n>`; PR title
            `chore: drain deferred-until-adjacent nits`. Each bundled fix must
            be bounded and unambiguous; skip any that is not. If there are no
            open `deferred-until-adjacent` issues, do nothing and exit.
          claude_args: |
            --model claude-sonnet-4-6
            --permission-mode bypassPermissions
            --allowed-tools Bash,Read,Write,Edit,Glob,Grep
            --append-system-prompt "Follow the platform standards in docs/standards/. Operate in Mode C cleanup-sweep per .claude/agents/implementer.md."
