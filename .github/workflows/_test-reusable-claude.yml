name: _test-reusable-claude
# THROWAWAY PROBE — delete after the #443 caveat test (ADR-0018 work).
# Minimal reusable workflow that runs claude-code-action with the default
# Claude GitHub App auth. Purpose: when this is `uses:`'d cross-repo from
# another repo, does the action's OIDC -> App-token exchange pass the
# "workflow file must match default branch" validation, or fail per
# anthropics/claude-code-action#443?

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe claude-code-action auth inside a cross-repo reusable
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Reply with exactly this and nothing else: probe-ok"
          claude_args: |
            --model claude-haiku-4-5-20251001
            --permission-mode bypassPermissions
            --allowed-tools Read
