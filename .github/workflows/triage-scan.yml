name: triage-scan
# Phase B of ADR-0017 — scheduled triage-bot scan.
# ADR-0020 — fleet orchestration: the promoter pass, and the dispatches it
# issues, now reach every repo in the fleet, not just this one. The loop is
# centralised here on the platform repo; its hands reach the whole portfolio.
#
# Three passes run from one scheduled invocation:
#   1. scan    — triage-bot scans telemetry for new issue patterns. A no-op
#                on the platform repo (no production telemetry).
#   2. promote — the FLEET promoter (ADR-0020): scans every fleet repo's open
#                issues, applies `ready-for-implementer` to eligible
#                agent-discovered work, and DISPATCHES that repo's
#                implementer. `severity:high` is now in scope.
#   3. flaws   — pulls `process-flaw` markers from the fleet and files them
#                here for the loop to act on (ADR-0019).
#
# WINDOW ENFORCEMENT: this workflow is the *only* path by which
# agent-discovered Medium/High work gets promoted. The cron is restricted to
# the work-hours + overnight windows (the window job below trims the DST
# edges), so promotion can only happen in-window — ADR-0017's gate, enforced
# at the promoter.

on:
  schedule:
    # Cron is UTC. America/Chicago is UTC-5 (CDT) or UTC-6 (CST). Both crons
    # fire on a generous UTC band; the window-check job trims to the precise
    # America/Chicago window (DST-correct).
    #
    # The band must compensate for GitHub Actions cron drift, which is
    # observed (2026-05-26..28) to delay fires by 2–3 hours and drop a
    # significant fraction of slots during periods of platform load. The
    # band therefore starts ~3 h BEFORE the earliest in-window UTC slot for
    # the CDT/CST union, so even a delayed fire still lands inside the
    # window — and runs at :00 / :30 to maximise the chance that at least
    # one slot per window is delivered.
    #
    # work-hours window = Mon-Fri 09:00-12:00 Chicago
    #   = 14:00-17:00 UTC (CDT) / 15:00-18:00 UTC (CST)
    #   CDT/CST union = 14:00-18:00 UTC; band starts 11:00 UTC
    - cron: '0,30 11-17 * * 1-5'
    # overnight window = daily 01:00-04:00 Chicago
    #   = 06:00-09:00 UTC (CDT) / 07:00-10:00 UTC (CST)
    #   CDT/CST union = 06:00-10:00 UTC; band starts 03:00 UTC
    - cron: '0,30 3-9 * * *'
    # ADR-0044 §3 (merge-when-green): all-day sweep so a green PR never idles
    # waiting for a triage window. ONLY the auto-merge job acts on these
    # fires — triage/promotion remain window-gated (ADR-0017). Offset to
    # :15/:45 so it doesn't stack on the window-band fires above.
    - cron: '15,45 * * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this manual triage scan is being run'
        required: false
        type: string
  # ADR-0044 §3: this repo's own review gate completing triggers an immediate
  # merge sweep — true merge-on-green for platform PRs. (App-repo gates can't
  # notify cross-repo without per-repo forwarders; their green PRs ride the
  # all-day cron sweep instead, worst-case dwell ≈ one cron interval.)
  workflow_run:
    workflows: [pr-review]
    types: [completed]
  # ADR-0030: trusted-origin events route through the promoter (no direct
  # bypass to the implementer). On the platform repo these fire same-repo;
  # app repos forward via repository_dispatch (model B — one central promoter).
  issues:
    types: [opened, labeled]
  repository_dispatch:
    types: [implementer-event]

permissions:
  contents: read
  issues: write         # label + comment on issues (event-dispatch, Pass 3)
  pull-requests: read   # ADR-0030 throttle: count in-flight implementer PRs
  actions: write        # ADR-0030: dispatch claude-implementer.yml
  id-token: write       # claude-code-action OIDC

concurrency:
  group: triage-scan-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # ── Window check — skip scheduled runs that fall outside the window ──────
  window:
    runs-on: ubuntu-latest
    outputs:
      in_window: ${{ steps.check.outputs.in_window }}
      window: ${{ steps.check.outputs.window }}
    steps:
      - id: check
        name: Determine current window (America/Chicago)
        run: |
          # workflow_dispatch is human-requested — always proceed.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "in_window=true"  >> "$GITHUB_OUTPUT"
            echo "window=manual"   >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$((10#$(TZ=America/Chicago date +%H)))
          dow=$(TZ=America/Chicago date +%u)   # 1=Mon .. 7=Sun
          # overnight: daily 01:00-04:00 Chicago (while Jason is asleep)
          if [[ $hour -ge 1 && $hour -lt 4 ]]; then
            echo "in_window=true"     >> "$GITHUB_OUTPUT"
            echo "window=overnight"   >> "$GITHUB_OUTPUT"
          # work-hours: Mon-Fri 09:00-12:00 Chicago (while Jason is at work)
          elif [[ $dow -le 5 && $hour -ge 9 && $hour -lt 12 ]]; then
            echo "in_window=true"     >> "$GITHUB_OUTPUT"
            echo "window=work-hours"  >> "$GITHUB_OUTPUT"
          else
            echo "in_window=false"    >> "$GITHUB_OUTPUT"
            echo "window=quiet"       >> "$GITHUB_OUTPUT"
            echo "::notice::Outside the overnight/work-hours window (Chicago hour=$hour, dow=$dow); skipping scan."
          fi

  # ── triage-bot: scan + fleet promoter + flaw pull ───────────────────────
  triage:
    needs: window
    # The full LLM fleet-scan runs only on the schedule and manual dispatch.
    # Issues / repository_dispatch events are handled deterministically by
    # event-dispatch (ADR-0030); running the scan on them is redundant AND fails
    # when a bot filed the triggering issue (claude-code-action rejects a Bot
    # actor: "Workflow initiated by non-human actor").
    # The ADR-0044 all-day merge-sweep cron ('15,45 * * * *') is excluded —
    # its in-window fires must not double the LLM scan cadence; it exists for
    # the auto-merge job only.
    if: |
      needs.window.outputs.in_window == 'true'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && github.event.schedule != '15,45 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Mint a GitHub App installation token — the loop's cross-repo
      # credential (ADR-0020). Issues + Actions write across the fleet;
      # short-lived (~1h). Supersedes FEEDBACK_READ_TOKEN.
      - name: Mint fleet App token
        id: fleet-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # ADR-0030 shared ceiling: the windowed promoter must respect the SAME
      # fleet-wide in-flight budget as event-dispatch and the urgent poll — not a
      # per-run batch cap. Compute the available budget deterministically BEFORE
      # the LLM so it can never dispatch on top of runs already in flight.
      - name: Compute fleet dispatch budget
        id: budget
        env:
          GH_TOKEN: ${{ steps.fleet-token.outputs.token }}
          FLEET_MAX_DISPATCH: ${{ vars.FLEET_MAX_DISPATCH_PER_RUN || '6' }}
        run: |
          set -uo pipefail
          cap=${FLEET_MAX_DISPATCH:-6}
          if inflight=$(bash "$GITHUB_WORKSPACE/scripts/fleet-inflight.sh"); then
            avail=$(( cap - inflight )); (( avail < 0 )) && avail=0
          else
            avail=$cap; inflight="?"   # FAIL OPEN: couldn't read → full budget
          fi
          echo "available=$avail" >> "$GITHUB_OUTPUT"
          echo "Fleet dispatch budget: cap=$cap in-flight=$inflight available=$avail"
          echo "## Fleet dispatch budget — available=$avail (cap=$cap, in-flight=$inflight)" >> "$GITHUB_STEP_SUMMARY"

      - name: Run triage-bot (scan + fleet promote + flaw pull)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLEET_TOKEN: ${{ steps.fleet-token.outputs.token }}
          FLEET_MAX_DISPATCH: ${{ vars.FLEET_MAX_DISPATCH_PER_RUN || '6' }}
          AVAILABLE: ${{ steps.budget.outputs.available }}
          WINDOW: ${{ needs.window.outputs.window }}
        uses: anthropics/claude-code-action@d5726de019ec4498aa667642bc3a80fca83aa102 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          prompt: |
            Act as the `triage-bot` subagent (see plugins/ai-team/agents/triage-bot.md).
            This is a scheduled scan in the **${{ needs.window.outputs.window }}**
            window. Per ADR-0020 the promoter is fleet-wide — it reaches every
            repo in the fleet.

            Two credentials are in your environment:
              - `$GH_TOKEN` — the platform repo's own token. Use it only for
                same-repo operations (filing process-flaw issues in Pass 3).
              - `$FLEET_TOKEN` — a GitHub App token with Issues + Actions
                write across the fleet. Use it for EVERY scan, label, and
                dispatch: `GH_TOKEN=$FLEET_TOKEN gh ... --repo jaetill/<repo>`.

            The fleet — repos the promoter scans and can dispatch:
              agentic-dev-environment game-night-pwa meal-planner ai-teacher
              jaetill-portal splendor draft carto
            (genealogy is intentionally excluded — it has no implementer
            workflow yet; never dispatch to it.)

            The platform repo (agentic-dev-environment) IS in the fleet: its
            own agent-discovered findings, and the process-flaw issues Pass 3
            files here, are promoted and dispatched the same way. Its
            implementer self-modifies the team and its PRs need a human merge
            (ADR-0019) — that is handled downstream, not by you.

            Run THREE passes, in order.

            ## Pass 1 — Scan
            Run your Tier 1 scan. On the platform repo this is a no-op — no
            production telemetry. Do not manufacture findings.

            ## Pass 2 — Fleet promoter + dispatch (ADR-0020)
            You move agent-discovered work from "filed" to "running" across
            every fleet repo.

            For each fleet repo, list its open issues:
              GH_TOKEN=$FLEET_TOKEN gh issue list --repo jaetill/<repo> \
                --state open --json number,title,labels,createdAt,author,comments --limit 100

            An issue is eligible for promotion when ALL hold:
              - It is EITHER (a) AGENT-discovered — the author is a bot, OR it
                carries a `source:*` or `triage:*` label — OR (b) a human
                feature carrying the `approved` label (ADR-0036). Other
                human-authored issues are NOT promoted here: a raw
                `feature-request` is still in formulation (the human owns the
                `what`); only `approved` signals intake is done.
              - TIER: an agent finding ranks by its `severity:*` / `triage:*`.
                An `approved` feature ranks at the **medium** tier — above
                low/nits, below `severity:high`/`critical`, equal footing with
                `severity:medium` / `triage:medium` (ADR-0036). A human-confirmed
                BUG carries its real `severity:*`, NOT `approved`.
              - For an AGENT finding the tier must be `severity:medium`,
                `severity:high`, or `triage:medium`. ADR-0020 folds
                `severity:high` in. Do NOT promote `severity:critical` or
                `source:sentry`: those auto-pick-up at the implementer already.
              - It does NOT already carry `ready-for-implementer`.
              - It has survived at least one full triage-scan cycle — do NOT
                promote an issue created in the last ~35 minutes.
              - It is well-specified: a clear repro or acceptance criteria, a
                single bounded change. Judgement call — when vague, leave it
                unpromoted and comment exactly what is missing. (An `approved`
                feature carries its human-written functional spec — trust it.)

            THROTTLE: dispatch at most $AVAILABLE implementer runs this run.
            $AVAILABLE is your HARD budget — it already accounts for implementer
            runs in flight elsewhere in the fleet (the shared ADR-0030 ceiling of
            $FLEET_MAX_DISPATCH minus what is already running), so you never
            dispatch on top of work the event-dispatch or urgent-poll paths
            already started. If $AVAILABLE is 0, promote and dispatch NOTHING this
            pass — still run Pass 1 and Pass 3. Order by tier — every eligible
            `severity:high` before any medium, where the medium tier is
            `severity:medium` / `triage:medium` findings AND `approved` features
            together (ADR-0036). When the budget is reached, stop; the next cycle
            takes the rest.

            For each eligible issue, within the $AVAILABLE budget:
              1. GH_TOKEN=$FLEET_TOKEN gh issue edit <n> --repo jaetill/<repo> \
                   --add-label ready-for-implementer
              2. ADJACENCY BUNDLE (ADR-0029): if this issue is a finding that
                 cites a file F (e.g. a `[code-review] F:line — …` title or a
                 file path in the body), collect open low/nit findings
                 (`severity:low,severity:nit`, excluding `ready-for-implementer`)
                 in the SAME repo that cite the SAME file F — up to
                 min(floor(total/2), 4). They ride along in this dispatch and do
                 NOT consume an $AVAILABLE budget slot. NEVER dispatch a nit on
                 its own. (You own workload selection; the implementer no longer
                 hunts the queue — it executes what you hand it.)
              3. Dispatch that repo's implementer. Per ADR-0020 the label is
                 durable state; THIS dispatch is the trigger. Use the filename-based
                 REST endpoint, NOT `gh workflow run` (the latter resolves to the
                 ID-based endpoint, which 500s fleet-wide — #410/#432). Detect the
                 default branch (`draft`/`carto` use `master`, others `main`; a
                 hardcoded ref 422s):
                   default_branch=$(GH_TOKEN=$FLEET_TOKEN gh api repos/jaetill/<repo> --jq .default_branch)
                   GH_TOKEN=$FLEET_TOKEN gh api --method POST \
                     repos/jaetill/<repo>/actions/workflows/claude-implementer.yml/dispatches \
                     -f ref="$default_branch" \
                     -f "inputs[issue_number]=<n>" \
                     -f "inputs[bundle_issues]=<comma-separated nit numbers, or omit if none>"
              4. GH_TOKEN=$FLEET_TOKEN gh issue comment <n> --repo jaetill/<repo> \
                   --body "Auto-promoted and dispatched by the fleet promoter (ADR-0020). Adjacent nits bundled: <list or none> (ADR-0029)."
            Confirm each dispatch `gh api` call exited 0 — a failed dispatch is a
            real failure; name it in the summary.

            SPARE-CAPACITY SWEEP: only if you dispatched AT LEAST ONE real
            promotion this cycle AND fewer than $AVAILABLE total,
            spend each remaining slot draining nits (ADR-0028). On a cycle
            with ZERO real promotions, do NOT sweep — nits ride along only
            when the loop is already doing real work; they wait for a cycle
            that has real work. (Rationale: nothing exploitable is ever a
            nit — security findings with a realistic attack path are
            High+ and auto-pick-up — so deferring nit-only cycles delays no
            real fix, and it cuts the self-collision churn from nit-only runs.)
            When the sweep is eligible: pick the fleet repo with the most open
            low/nit issues (`severity:low,severity:nit`, excluding
            `ready-for-implementer`) — skip any repo whose count is
            zero, a cleanup-sweep there is a wasted run — and dispatch one
            cleanup-only run via the filename-based endpoint (not `gh workflow
            run` — #410/#432):
              default_branch=$(GH_TOKEN=$FLEET_TOKEN gh api repos/jaetill/<repo> --jq .default_branch)
              GH_TOKEN=$FLEET_TOKEN gh api --method POST \
                repos/jaetill/<repo>/actions/workflows/claude-implementer.yml/dispatches \
                -f ref="$default_branch" \
                -f "inputs[mode]=cleanup-sweep"
            One cleanup dispatch per spare slot; never the same repo twice;
            never exceed the cap.

            ## Pass 3 — Pull process-flaw markers (ADR-0019)
            For each fleet repo, list its open `process-flaw` issues:
              GH_TOKEN=$FLEET_TOKEN gh issue list --repo jaetill/<repo> \
                --state open --label process-flaw --json number,title,body,url

            For each, file a matching issue ON THIS platform repo so the loop
            can act on it — unless one already exists. Dedup by searching this
            repo for the source URL (default token):
              gh issue list --state open --search "<project-issue-url>" --json number

            File new ones with the default token:
              gh issue create --label "process-flaw,triage:medium" \
                --title "[process-flaw] <project>: <short description>" \
                --body "Reported from ONE project (jaetill/<project> issue <url>) — n=1, generality NOT established. Per Standard 12 the architect must abstract it and decide: general flaw (fix ai-team) or project-local (resolve in <project>'s knowledge layer). <body>"

            ## Summary
            Report: repos scanned, issues promoted (split by severity),
            implementers dispatched, cleanup sweeps dispatched, any FAILED
            dispatches, process-flaw markers pulled, new platform issues filed.
          claude_args: |
            --model claude-sonnet-4-6
            --permission-mode bypassPermissions
            --allowed-tools Bash,Read,Grep,Glob
            --append-system-prompt "Follow the platform standards in docs/standards/. Fleet promotion is a Tier 2 (Sonnet) judgement per ADR-0017 and ADR-0020 — be conservative. An unpromoted issue waits one window; a wrongly-promoted vague issue wastes an implementer run somewhere in the fleet. When in doubt, do not promote."

  # ── Auto-merge — close the loop on routine implementer fix PRs (ADR-0021) ─
  # ADR-0003 set the approval model to AI shipping authority; ADR-0021 applies
  # it to the autonomous implementer's fix PRs. This job merges green,
  # qualifying implementer PRs across the fleet (platform repo included for
  # routine work per ADR-0039), AS THE FLEET APP — so the merge cascades to
  # release-please + deploy (a GITHUB_TOKEN merge would trigger nothing
  # downstream, ADR-0018). The gate is deterministic — issue type + check
  # state + labels, no agent judgement.
  # ADR-0044 §3 (merge-when-green): this job is UN-WINDOWED — a green,
  # ungated PR merges any time. It fires on every schedule (window bands +
  # the all-day sweep cron), on workflow_dispatch, and event-driven on this
  # repo's own gate completing (workflow_run). Gates that hold a green PR
  # now mark it with an exact-match `hold:<reason>` label (strip-on-exit).
  # `vars.AUTONOMOUS_MERGE=off` pauses this job fleet-wide;
  # `vars.AUTONOMOUS_MERGE_CAP` (default 10) caps merges per run.
  auto-merge:
    if: |
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mint fleet App token
        id: fleet-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Check out platform repo (self-change guard script — ADR-0032)
        uses: actions/checkout@v4

      - name: Merge qualifying implementer fix PRs
        env:
          GH_TOKEN: ${{ steps.fleet-token.outputs.token }}
          AUTONOMOUS_MERGE: ${{ vars.AUTONOMOUS_MERGE || 'on' }}
          AUTONOMOUS_MERGE_CAP: ${{ vars.AUTONOMOUS_MERGE_CAP || '10' }}
        run: |
          set -uo pipefail
          if [[ "${AUTONOMOUS_MERGE}" == "off" ]]; then
            echo "::notice::AUTONOMOUS_MERGE=off — autonomous merge is paused."
            echo "## Auto-merge: paused (AUTONOMOUS_MERGE=off)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Per ADR-0039, code merge is autonomous for all review-passing linked
          # work regardless of origin (ADR-0023's origin boundary is retired at
          # the merge; the human checkpoint moves to test->prod promotion, #179).
          # The platform repo is included for routine/mechanical fixes.
          # Compositional self-changes (team gates / agents / standards /
          # security) and ADR-gated changes are still held by the label checks
          # below. genealogy still has no implementer loop.
          REPOS="game-night-pwa meal-planner ai-teacher jaetill-portal splendor draft carto agentic-dev-environment"
          merged=0 ; held=0 ; evaluated=0
          # Per-run blast-radius cap (security-review): a malfunctioning or
          # adversarially-prompted implementer cannot land more than this many
          # merges in one window — the rest wait for the next cron or a human.
          cap=${AUTONOMOUS_MERGE_CAP:-10}
          # Guard a non-integer cap (#62): under `set -uo pipefail` (no -e), a
          # non-numeric cap makes `[[ $merged -ge $cap ]]` error to false, so the
          # cap never trips and merges run unbounded. Fall back to the default.
          [[ "$cap" =~ ^[1-9][0-9]*$ ]] || { echo "::warning::AUTONOMOUS_MERGE_CAP='$cap' is not a positive integer — defaulting to 10"; cap=10; }
          for repo in $REPOS; do
            slug="jaetill/${repo}"
            # terminology-check: deprecated-app-claude-ok-here (historical reference explaining why the old filter was replaced)
            # Implementer-authored PRs only. The original `author.login ==
            # "app/claude"` filter (closed #58) never matched. A subsequent
            # attempt to filter on commit-author-name (security-review #349)
            # was rejected as spoofable — `git config user.name` is
            # free-form and can be set by any committer with write access.
            # The fleet implementer now creates PRs via the
            # jaetill-ai-triage-team App installation token (claude-implementer-
            # reusable.yml manual-dispatch step). `gh pr list --json author`
            # may render the bot's login as either `app/<slug>` (the form
            # release-please surfaces today) or `<slug>[bot]` (the comment-actor
            # form) depending on the gh CLI version's serialization. Anchored
            # regex prevents a bot whose login contains the App slug as a
            # substring (e.g. "jaetill-ai-triage-team-staging") from slipping
            # through (#355). `is_bot == true` still gates out human accounts.
            prs=$(gh pr list --repo "$slug" --state open --json number,author \
                    --jq '.[] | select(.author.is_bot == true and (.author.login | test("^(app/)?jaetill-ai-triage-team(\\[bot\\])?$"))) | .number' 2>/dev/null || true)
            # Count what the filter matched so we can detect silent zero-everywhere
            # (the failure mode that hid #58 fleet-wide for weeks: filter returns
            # nothing across every repo, sweep reports "0 merged" with no error,
            # auto-merge feature appears off when it's actually broken).
            repo_prs_count=$(printf '%s\n' "$prs" | grep -c '^[0-9]' || true)
            evaluated=$((evaluated + repo_prs_count))
            for pr in $prs; do
              if [[ "$merged" -ge "$cap" ]]; then
                echo "::notice::Auto-merge per-run cap ($cap) reached — remaining qualifying PRs left for the next window."
                break 2
              fi
              meta=$(gh pr view "$pr" --repo "$slug" --json labels,body,mergeStateStatus 2>/dev/null || true)
              if [[ -z "$meta" ]]; then
                echo "  $slug#$pr — could not read PR; hold"; held=$((held+1)); continue
              fi
              # ADR-0021 cond. 3 — no requires-adr:* label (ADR-gated → human).
              # ADR-0044 §3: mark the resting state exact-match queryable.
              if echo "$meta" | jq -e '[.labels[].name] | any(startswith("requires-adr"))' >/dev/null 2>&1; then
                gh pr edit "$pr" --repo "$slug" --add-label "hold:adr" >/dev/null 2>&1 || true
                echo "  $slug#$pr — requires-adr label; hold:adr for human"; held=$((held+1)); continue
              fi
              # ADR-0047: the compositional hold is decided by the deterministic
              # capability-delta guard below (authoritative) — not by the
              # LLM-applied `compositional-self-change` label. Fallback hold
              # (#425 defense-in-depth): if the guard returns IN_LANE but the
              # label is present, the discrepancy is logged and the PR is held.
              # ADR-0021 cond. 1, as amended by ADR-0039: a linked issue must be
              # PRESENT for traceability, but its ORIGIN no longer gates the
              # merge. ADR-0023's HHUM hold — human-origin work waiting for a
              # human merge click — is RETIRED. Review-passing, linked work
              # merges autonomously regardless of who filed the issue. The
              # human's checkpoint moves off the merge and onto test->prod
              # promotion for user-facing features (#179); until that gate
              # exists, all merges/releases are treated as test. The
              # architectural gate above (requires-adr:* -> hold:adr), the
              # capability-delta firewall below (ADR-0047), and the checks
              # battery still hold — this is "routine reviewed work ships
              # itself," never "skip the checks."
              issue=$(echo "$meta" | jq -r '.body // ""' \
                        | grep -ioE '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+' \
                        | grep -oE '[0-9]+' | head -1 || true)
              if [[ -z "$issue" ]]; then
                echo "  $slug#$pr — no linked issue; hold"; held=$((held+1)); continue
              fi
              # issue_meta is still read: the ADR-0032 (agent-quality) and
              # ADR-0035 (scope:iac) gates below classify from the issue labels.
              issue_meta=$(gh issue view "$issue" --repo "$slug" --json author,labels 2>/dev/null || echo '{}')
              # ADR-0047 capability-delta firewall (generalizes the ADR-0032
              # additive self-change lane). The deterministic guard runs on
              # EVERY candidate PR and decides whether the change expands loop
              # capability or weakens a control: a changed gate/governance file,
              # guardrail vocabulary on an added/removed line, a net-new external
              # action, or a destructive migration. HOLD -> hold:compositional
              # for human ratification; IN_LANE -> routine reviewed work ships
              # itself. The guard is authoritative — it does not rely on the
              # agent-applied compositional-self-change label. Fail closed: a
              # guard error holds. IAM/IaC risk is judged by the ADR-0035 gate
              # below, not here.
              # The compositional firewall is platform-only (ADR-0019/0047):
              # app-repo changes are never self-changes. Pass repo context so the
              # guard scopes its gate-machinery checks accordingly.
              is_platform_repo=$([[ "$slug" == "$GITHUB_REPOSITORY" ]] && echo true || echo false)
              guard=$(CHANGED_FILES="$(gh pr view "$pr" --repo "$slug" --json files --jq '.files[].path' 2>/dev/null || true)" \
                      DIFF="$(gh pr diff "$pr" --repo "$slug" 2>/dev/null || true)" \
                      IS_PLATFORM="$is_platform_repo" \
                      bash "${GITHUB_WORKSPACE}/scripts/additive-self-change-guard.sh" 2>/dev/null || echo "HOLD: guard error")
              case "$guard" in
                IN_LANE*)
                  if echo "$meta" | jq -e '[.labels[].name] | any(. == "compositional-self-change")' >/dev/null 2>&1; then
                    gh pr edit "$pr" --repo "$slug" --add-label "hold:compositional" >/dev/null 2>&1 || true
                    echo "::warning::$slug#$pr — label/guard discrepancy: guard=$guard but compositional-self-change label present — held (#425)"
                    echo "  $slug#$pr — hold:compositional (label/guard discrepancy; guard=$guard)"; held=$((held+1)); continue
                  fi
                  echo "  $slug#$pr — capability-neutral, $guard (ADR-0047)";;
                *) gh pr edit "$pr" --repo "$slug" --add-label "hold:compositional" >/dev/null 2>&1 || true
                   echo "  $slug#$pr — hold:compositional for human ($guard) (ADR-0047)"; held=$((held+1)); continue;;
              esac
              # ADR-0035 — scope:iac PRs auto-merge (== auto-apply on dev via the
              # push:[main] deploy cascade) ONLY behind an affirmative deterministic
              # plan guard. The unexercised human-merge checkpoint is not a control;
              # safety lives in the iac-additive-guard check (iac-guard.yml), which
              # classifies `tofu show -json` output as safe-additive or holds.
              # Absent or non-passing check -> hold (closed conservatively before
              # the per-repo guard caller is propagated — no auto-merge regression).
              is_iac=$(echo "$issue_meta" | jq -e '[.labels[].name] | any(. == "scope:iac")' >/dev/null 2>&1 && echo true || echo false)
              if [[ "$is_iac" == "true" ]]; then
                iac_buckets=$(gh pr checks "$pr" --repo "$slug" --json name,bucket \
                                --jq '[.[] | select(.name | test("iac-additive-guard")) | .bucket]' 2>/dev/null || echo '[]')
                if ! echo "$iac_buckets" | jq -e 'length > 0 and all(.[]; . == "pass")' >/dev/null 2>&1; then
                  gh pr edit "$pr" --repo "$slug" --add-label "hold:iac-unverified" >/dev/null 2>&1 || true
                  echo "  $slug#$pr — scope:iac requires a passing iac-additive-guard check (ADR-0035); hold:iac-unverified"
                  held=$((held+1)); continue
                fi
                echo "  $slug#$pr — iac-additive-guard passed (ADR-0035)"
              fi
              # ADR-0021 cond. 2 — the REQUIRED checks are green. Two-part gate:
              #
              # (a) Non-empty guard: a repo with CI disabled (zero checks) must
              #     not slip through vacuously. `gh pr checks` emits bucket rows
              #     regardless of exit code; an empty result = no checks = hold.
              #
              # (b) Green-ness is decided by GitHub's mergeStateStatus, NOT by
              #     re-deriving it from every check bucket (#273). The old "all
              #     buckets must be pass/skipping" test held a fully-green PR
              #     whenever ANY non-required status hung — observed: Vercel's
              #     `Vercel` deployment commit-status stuck `pending` on
              #     ai-teacher#173 left review+tests green but the PR UNSTABLE
              #     forever, with no hold:* label (an invisible resting state —
              #     exactly what ADR-0044 retired). mergeStateStatus uses the
              #     repo's OWN required-check configuration (which includes
              #     review/code-review + review/security-review) as the source
              #     of truth:
              #       CLEAN    — required all green, no required review outstanding → merge
              #       UNSTABLE — required all green; only a NON-required check is
              #                  failing/pending (the Vercel case)            → merge
              #       BLOCKED  — a required check failing/pending (logged as such),
              #                  OR a required CODEOWNERS review outstanding
              #                  (logged as "review/CODEOWNERS gate")         → hold
              #       other    — BEHIND / DIRTY / DRAFT / UNKNOWN              → hold
              #     Because the security battery is in the required set, CLEAN|
              #     UNSTABLE still guarantees code-review + security-review passed.
              buckets=$(gh pr checks "$pr" --repo "$slug" --json bucket --jq '.[].bucket' 2>/dev/null || true)
              if [[ -z "$buckets" ]]; then
                echo "  $slug#$pr — no checks reported; hold (gate requires a green CI battery)"
                held=$((held+1)); continue
              fi
              mss=$(echo "$meta" | jq -r '.mergeStateStatus // "UNKNOWN"')
              # UNKNOWN = GitHub is still (re)computing mergeability — almost
              # always transient, and routinely triggered when a PREVIOUS merge
              # in this same run advanced the base. Holding on UNKNOWN caps the
              # sweep at ~1 merge per run (every other eligible PR flips to
              # UNKNOWN the moment the first one lands). Re-poll briefly so one
              # run can drain a whole batch instead of one-per-sweep.
              repoll=0
              while [[ "$mss" == "UNKNOWN" && $repoll -lt 5 ]]; do
                sleep 4; repoll=$((repoll+1))
                mss=$(gh pr view "$pr" --repo "$slug" --json mergeStateStatus --jq '.mergeStateStatus // "UNKNOWN"' 2>/dev/null || echo "UNKNOWN")
              done
              case "$mss" in
                CLEAN|UNSTABLE) ;;  # required checks green → eligible to merge
                BEHIND) echo "  $slug#$pr — hold: BEHIND base branch (needs branch update)"; held=$((held+1)); continue;;
                DIRTY)  echo "  $slug#$pr — hold: DIRTY merge conflict (needs rebase — ADR-0042)"; held=$((held+1)); continue;;
                BLOCKED)
                  # Distinguish failing/pending required check from a
                  # CODEOWNERS/review gate. Filter to required-only via
                  # statusCheckRollup so a slow optional check (e.g. Vercel
                  # deployment) does not falsely look like a CI failure (#440).
                  # Use .conclusion // .state // .status to cover all three
                  # GitHub check field shapes: CheckRun completion (.conclusion),
                  # StatusContext state (.state), and in-progress CheckRun where
                  # .conclusion is null and .state is absent (.status =
                  # IN_PROGRESS/QUEUED/WAITING — #443).
                  req_states=$(gh pr view "$pr" --repo "$slug" \
                    --json statusCheckRollup \
                    --jq '[.statusCheckRollup[] | select(.isRequired == true) | .conclusion // .state // .status] | .[]' \
                    2>/dev/null || true)
                  if printf '%s\n' "$req_states" | grep -Eqi \
                      '^(FAILURE|TIMED_OUT|CANCELLED|ACTION_REQUIRED|ERROR|failure|fail|pending|IN_PROGRESS|QUEUED|WAITING|REQUESTED)$'; then
                    echo "  $slug#$pr — hold: BLOCKED — a required check is failing or pending"
                  else
                    # All required checks green but still BLOCKED → the CODEOWNERS /
                    # branch-protection review gate (a bot PR touching rails paths
                    # needs @jaetill's review-approval). Mark it so the cockpit's
                    # waiting-on-Jason counts see it, instead of an invisible
                    # resting state (#271, ADR-0044).
                    gh pr edit "$pr" --repo "$slug" --add-label "hold:compositional" >/dev/null 2>&1 || true
                    echo "  $slug#$pr — hold:compositional — BLOCKED with all required checks green → CODEOWNERS/branch-protection review gate (needs @jaetill; not a CI failure)"
                  fi
                  held=$((held+1)); continue;;
                *) echo "  $slug#$pr — hold: mergeStateStatus=$mss (still computing or unsupported)"
                   held=$((held+1)); continue;;
              esac
              # Belt-and-suspenders: ADR-0021 hard gates — security-review and
              # code-review must be explicitly present and passing. mergeStateStatus
              # only enforces these if the repo has them configured as required
              # checks; if the caller stub is absent or has an unmet `if:`, the
              # check surfaces as skipping, which does not affect mergeStateStatus
              # and would pass the gate above silently (issue #61).
              all_checks=$(gh pr checks "$pr" --repo "$slug" --json name,bucket 2>/dev/null || echo '[]')
              for hard_gate in security-review code-review; do
                gate_bucket=$(echo "$all_checks" \
                  | jq -r --arg g "$hard_gate" \
                      '[.[] | select(.name | test($g)) | .bucket] | first // ""')
                if [[ "$gate_bucket" != "pass" ]]; then
                  gh pr edit "$pr" --repo "$slug" --add-label "hold:review-gate" >/dev/null 2>&1 || true
                  echo "  $slug#$pr — $hard_gate not passing (bucket: ${gate_bucket:-absent}); hold:review-gate (ADR-0021 #61)"
                  held=$((held+1)); continue 2
                fi
              done
              # All conditions hold — strip any stale hold:* marker
              # (label law: strip-on-exit, ADR-0044) and merge as the fleet App.
              stale_holds=$(echo "$meta" | jq -r '[.labels[].name | select(startswith("hold:"))] | join(",")' 2>/dev/null || true)
              if [[ -n "$stale_holds" ]]; then
                gh pr edit "$pr" --repo "$slug" --remove-label "$stale_holds" >/dev/null 2>&1 || true
              fi
              if gh pr merge "$pr" --repo "$slug" --squash --delete-branch; then
                echo "::notice::Auto-merged $slug#$pr (fix for #$issue) per ADR-0021."
                merged=$((merged+1))
                # ADR-0047 self-change digest — log every auto-merged PLATFORM
                # self-change to a standing issue for after-the-fact visibility
                # (the compositional firewall is platform-only, so a platform
                # auto-merge is exactly a guard-passed self-change). Fully
                # isolated (subshell + || true): a digest failure can never
                # affect the merge loop, and runs only after the merge succeeded.
                if [[ "$is_platform_repo" == "true" ]]; then ( set +e
                  log=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                          --search "Agent self-change log in:title" --json number --jq '.[0].number')
                  if [[ -z "$log" ]]; then
                    url=$(gh issue create --repo "$GITHUB_REPOSITORY" \
                            --title "Agent self-change log (ADR-0047)" \
                            --body "Running log of platform self-changes the loop auto-merged without human review (capability-delta IN_LANE, ADR-0047). Each entry links the merged PR.")
                    log="${url##*/}"
                  fi
                  [[ -n "$log" ]] && gh issue comment "$log" --repo "$GITHUB_REPOSITORY" \
                    --body "Auto-merged self-change: ${slug}#${pr} (fix for #${issue})."
                ) || true; fi
              else
                # Qualified (checks green, hard gates passed) but the merge was
                # still refused — almost always the CODEOWNERS review gate on a
                # rails-path PR. Mark hold:compositional so it surfaces in the
                # waiting-on-Jason counts rather than resting invisibly (#271).
                gh pr edit "$pr" --repo "$slug" --add-label "hold:compositional" >/dev/null 2>&1 || true
                echo "::warning::$slug#$pr qualified but the merge was refused (likely the CODEOWNERS review gate); hold:compositional for a human (#271)."
                held=$((held+1))
              fi
            done
          done
          echo "## Auto-merge — $evaluated evaluated, $merged merged, $held held" >> "$GITHUB_STEP_SUMMARY"
          echo "Auto-merge sweep complete: $evaluated evaluated, $merged merged, $held held."
          # Loud-on-empty: if the filter matched ZERO PRs across the entire
          # fleet, that is suspicious. Either the queue is genuinely empty
          # (legitimate) or the author filter is broken (silent failure mode
          # that hid #58 for weeks). Emit a warning so the next reader sees
          # it — does NOT fail the run, the queue might really be empty.
          if [[ "$evaluated" -eq 0 ]]; then
            echo "::warning::Auto-merge sweep matched 0 PRs across the entire fleet ($REPOS). If you expected open implementer PRs to be evaluated, the filter at triage-scan.yml may not match the current PR-author format. Diagnose with:  gh pr list --repo jaetill/<repo> --state open --json number,author"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ **0 PRs evaluated fleet-wide.** Either the queue is genuinely empty (fine) or the auto-merger filter has drifted from reality (broken). The filter currently matches \`author.is_bot == true and (author.login | test(\"^(app/)?jaetill-ai-triage-team(\\[bot\\])?$\"))\`. Verify against \`gh pr list --repo jaetill/<repo> --state open --json number,author\`." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── ADR-0030: deterministic, project-scoped event dispatch ──────────────
  # Trusted-origin signals (severity:critical / source:sentry / source:cloudwatch
  # / human-applied ready-for-implementer / owner-opened) route HERE instead of
  # bypassing straight to the implementer. Deterministic — no LLM on this path:
  # apply ready-for-implementer, throttle against FLEET_MAX_DISPATCH (fleet-wide
  # in-flight implementer PRs), then dispatch. Model B (one central promoter):
  # app repos forward their events via repository_dispatch; here on the platform
  # repo they fire same-repo. The LLM cycle-fill is a Phase-2 follow-up.
  # scope:iac is excluded (its path is unchanged for now — ADR-0030 §IaC path).
  # ADR-0036: owner-`opened` auto-dispatch is bug/defect ONLY. A raw
  # feature-request is NOT dispatched on open — it awaits human formulation →
  # `approved` (promoter, medium tier) or a human `ready-for-implementer`
  # fast-track. `feature-request` was therefore dropped from the opened branch.
  event-dispatch:
    if: |
      github.event_name == 'repository_dispatch'
      || (
        github.event_name == 'issues'
        && !contains(github.event.issue.labels.*.name, 'scope:iac')
        && (
          (
            github.event.action == 'labeled'
            && (
              contains(fromJSON('["source:sentry", "source:cloudwatch", "severity:critical"]'), github.event.label.name)
              || (github.event.label.name == 'ready-for-implementer' && github.event.sender.type != 'Bot')
            )
          )
          || (
            github.event.action == 'opened'
            && github.event.issue.user.type != 'Bot'
            && github.event.issue.author_association == 'OWNER'
            && (
              contains(github.event.issue.labels.*.name, 'bug')
              || contains(github.event.issue.labels.*.name, 'defect')
            )
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4   # for scripts/fleet-inflight.sh
      - name: Mint fleet App token
        id: fleet-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Promote and dispatch (deterministic, throttled)
        env:
          GH_TOKEN: ${{ steps.fleet-token.outputs.token }}
          FLEET_MAX_DISPATCH: ${{ vars.FLEET_MAX_DISPATCH_PER_RUN || '6' }}
          # Attacker-influenced values enter ONLY via env (never interpolated
          # into the run script) — a repository_dispatch client_payload is
          # caller-controlled, and the fleet App token is in scope here (#128, #126).
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_REPO: ${{ github.event.client_payload.repo }}
          PAYLOAD_ISSUE: ${{ github.event.client_payload.issue }}
          THIS_REPO: ${{ github.repository }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -uo pipefail
          # Resolve target repo + issue. `issues` events are same-repo; an app
          # repo's repository_dispatch forwarder (model B) carries them in the
          # client_payload.
          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            repo="${PAYLOAD_REPO:-}"
            issue="${PAYLOAD_ISSUE:-}"
          else
            repo="${THIS_REPO:-}"
            issue="${EVENT_ISSUE:-}"
          fi
          if [[ -z "${repo:-}" || -z "${issue:-}" ]]; then
            echo "::warning::event-dispatch: missing repo/issue; nothing to do."; exit 0
          fi
          # Validate shape before passing to gh: repo = owner/name, issue = numeric.
          if [[ ! "$repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ || ! "$issue" =~ ^[0-9]+$ ]]; then
            echo "::warning::event-dispatch: malformed repo ('$repo') or issue ('$issue'); refusing to dispatch."; exit 0
          fi
          echo "Trusted-origin event for ${repo}#${issue}."
          # scope:iac exclusion (#131): the `issues` event path filters scope:iac
          # in this job's `if:`, but `github.event.issue.labels` is empty on a
          # repository_dispatch event, so that guard is a no-op for forwarded
          # (model B) events. A forwarded scope:iac issue must NOT take the
          # regular implementer path — its IaC path is unchanged for now
          # (ADR-0030 §IaC). Re-check via the API on the repository_dispatch path.
          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            if gh issue view "$issue" --repo "$repo" --json labels \
                 --jq '[.labels[].name] | any(. == "scope:iac")' 2>/dev/null | grep -q true; then
              echo "::notice::event-dispatch: ${repo}#${issue} is scope:iac; its IaC path is unchanged (ADR-0030) — not dispatching the regular implementer."
              exit 0
            fi
          fi
          # Durable promotion state (idempotent).
          gh issue edit "$issue" --repo "$repo" --add-label ready-for-implementer || true
          # Throttle (ADR-0030): the cap is FLEET-WIDE — count actively running
          # implementer dispatches via the shared source of truth (scripts/
          # fleet-inflight.sh) so all three dispatch paths share ONE budget.
          # FAIL OPEN on a read error — never drop urgent work on a transient API
          # error.
          if inflight=$(bash "$GITHUB_WORKSPACE/scripts/fleet-inflight.sh"); then
            counted=true
          else
            counted=false
          fi
          cap=${FLEET_MAX_DISPATCH:-6}
          if [[ "$counted" == "true" && "$inflight" -ge "$cap" ]]; then
            echo "::notice::Active implementer runs ($inflight) >= cap ($cap). ${repo}#${issue} is labelled ready-for-implementer; the next promoter cycle will dispatch it. Not dispatching now."
            gh issue comment "$issue" --repo "$repo" --body "Promoted (\`ready-for-implementer\`). Fleet at dispatch cap ($inflight/$cap in flight) — the next promoter cycle will dispatch this (ADR-0030)." || true
            exit 0
          fi
          # Under cap (or fail-open): dispatch the implementer for this issue.
          # Use the filename-based REST endpoint, NOT `gh workflow run` (which
          # resolves to the ID-based endpoint and 500s fleet-wide — #410/#432).
          # Detect the default branch (master on draft/carto, main elsewhere;
          # a hardcoded ref 422s on the master repos).
          default_branch=$(gh api "repos/$repo" --jq .default_branch)
          gh api --method POST \
            "repos/$repo/actions/workflows/claude-implementer.yml/dispatches" \
            -f ref="$default_branch" \
            -f "inputs[issue_number]=$issue"
          echo "::notice::Dispatched implementer for ${repo}#${issue} (in-flight before dispatch: ${inflight}/${cap}, counted=${counted})."
          gh issue comment "$issue" --repo "$repo" --body "Auto-promoted and dispatched via the promoter's event path (ADR-0030)." || true
