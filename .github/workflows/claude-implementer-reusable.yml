name: claude-implementer (reusable)
# REUSABLE workflow (ADR-0018 / ADR-0034) — the single source of truth for the
# implementer. Repos invoke it via a thin `claude-implementer.yml` caller that
# forwards their issues/issue_comment/workflow_dispatch event with
# `secrets: inherit`. The `github` context (event_name, event.*) is inherited
# from the caller, so the job logic below is unchanged from the pre-reusable
# copy. Do NOT inline this into projects — inlined copies are the drift this
# eliminates. To change implementer behaviour, edit THIS file only.
#
# Phase B of ADR-0026 — invokes the implementer agent in one of two modes:
#
# Mode A (initial implementation): all Mode-A dispatch arrives via
#   workflow_dispatch → the `manual-dispatch` job. The promoter (triage-scan.yml,
#   ADR-0020/0030) is the dispatcher — owner-opened bug/defect dispatch
#   immediately via event-dispatch; agent findings and `approved` features
#   promote on a cycle, then dispatch via workflow_dispatch. Features are
#   formulated at human intake and enter via `approved` (ADR-0036) — they do NOT
#   build on open, and there is NO in-loop plan-gate: the plan-first PLAN PHASE
#   was retired by ADR-0036 (the `what` is decided at intake, the `how` by the
#   implementer's own plan-mode).
#
# Mode B (fix iteration): triggered when a PR authored by claude[bot]
#   receives a review with state REQUEST_CHANGES from code-reviewer or
#   security-reviewer (i.e. our gate steps failed). Agent reads feedback,
#   addresses each finding, pushes a new commit to the same branch.
#
# Hard guardrails (per ADR-0026):
#   - 400 LOC / 8 files / 3 components scope cap (enforced in agent prompt)
#   - Max 3 fix-iteration attempts before escalation
#   - Daily activation cap (TODO: enforce in workflow)
#   - Never commits to master (enforced by branch protection + agent prompt)
#   - Never modifies terraform/ (iac-implementer handles those)

on:
  # Invoked only via a thin per-repo caller (ADR-0034). The caller forwards its
  # issues / issue_comment / workflow_dispatch event; the jobs below gate on the
  # inherited `github.event_name` exactly as before. The three inputs carry the
  # caller's workflow_dispatch parameters through to the `inputs.*` context the
  # body already uses.
  workflow_call:
    inputs:
      issue_number:
        description: 'Issue number to implement (for manual dispatch / fleet promoter)'
        required: false
        type: string
      mode:
        description: 'cleanup-sweep = drain deferred nits only (fleet promoter spare-capacity, ADR-0020)'
        required: false
        type: string
      bundle_issues:
        description: 'Comma-separated low/nit (severity:low,severity:nit) issue numbers the promoter selected to ride along with issue_number (same-file, ADR-0029)'
        required: false
        type: string

permissions:
  contents: write       # branch creation + push
  pull-requests: write  # PR creation
  issues: write         # commenting on the issue
  id-token: write       # claude-code-action OIDC

# Cancel previous runs for the same issue; if a new label triggers a re-run,
# the older one's work is stale.
concurrency:
  group: implementer-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false   # don't kill mid-implementation

jobs:
  # ── Mode A: IaC implementation (separate agent) ─────────────────────────
  # ADR-0036: owner-`opened` auto-dispatch is bug/defect ONLY here too. An IaC
  # feature-request awaits formulation; because scope:iac bypasses the promoter
  # (ADR-0030), an approved IaC feature dispatches via a human
  # `ready-for-implementer` fast-track, not the promoter's medium tier.
  initial-iac:
    if: |
      github.event_name == 'issues'
      && contains(github.event.issue.labels.*.name, 'scope:iac')
      && (
        (
          github.event.action == 'labeled'
          && github.event.label.name == 'ready-for-implementer'
          && github.event.sender.type != 'Bot'
        )
        || (
          github.event.action == 'opened'
          && github.event.issue.user.type != 'Bot'
          && github.event.issue.author_association == 'OWNER'
          && (
            contains(github.event.issue.labels.*.name, 'bug')
            || contains(github.event.issue.labels.*.name, 'defect')
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mint implementer App token
        id: app-token
        # Pinned to SHA — receives FLEET_APP_PRIVATE_KEY (the highest-value
        # secret in the fleet); tag overwrites on @v1 would silently rotate
        # action code under our private key (security-review #351 High).
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: opentofu/setup-opentofu@v1
      - name: Configure AWS credentials (read-only iac-drift role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::214599503944:role/game-night-iac-drift
          aws-region: us-east-2
      - name: Configure git author
        run: |
          git config user.name 'claude[bot]'
          git config user.email '41898282+claude[bot]@users.noreply.github.com'
      - name: Run iac-implementer agent
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          show_full_output: true
          prompt: |
            Act as the `iac-implementer` subagent (.claude/agents/iac-implementer.md).
            You are operating in **Mode A — initial IaC implementation**.

            Work item: issue #${{ github.event.issue.number }} with label `scope:iac`.

            Read the issue:
              gh issue view ${{ github.event.issue.number }} --json title,body,labels

            Follow your spec's Mode A process exactly. Critical rules:
              - cd terraform/envs/prod
              - Run `tofu init`, `tofu validate`, `tofu plan`
              - NEVER run `tofu apply` or `tofu destroy`
              - NEVER modify state directly
              - Open the PR with the full `tofu plan` output in the body
              - If destructive-change-detector would flag this change, check
                for a paired Accepted ADR; if none, post a comment and stop.
              - Scope cap: max 5 resources per PR.

            After opening the PR, stop. You never apply. Apply happens via the
            deploy cascade after merge (auto on dev under the ADR-0035 guard if
            the plan is safe-additive; otherwise a human merges). Keep the change
            genuinely minimal and additive so the iac-additive-guard can clear it.
          claude_args: |
            --model claude-sonnet-4-6
            --permission-mode bypassPermissions
            --allowed-tools Bash,Read,Write,Edit,Glob,Grep
            --append-system-prompt "Follow the platform standards in docs/standards/. Adhere strictly to the iac-implementer agent's scope cap and authority rules per .claude/agents/iac-implementer.md."

  # ── Mode B: fix iteration ───────────────────────────────────────────────
  fix-iteration:
    # Triggered when a reviewer agent posts a comment containing
    # "VERDICT: BLOCK" on a PR authored by claude[bot]. Per issue #24,
    # our reviewer agents post issue comments (not formal PR reviews),
    # so we listen on issue_comment events and parse the body.
    #
    # Filters in order:
    #   1. Must be an issue_comment event (pull_request_review path retired)
    #   2. Must be on a PR (issue_comment fires for both issues and PRs;
    #      PR comments have pull_request set on the parent issue)
    #   3. Comment author must be claude[bot] (the reviewer)
    #   4. Comment body must contain "VERDICT: BLOCK"
    #   5. PR head branch must start with impl/ (implementer-authored PR)
    #
    # The 3-attempt cap (enforced in the agent prompt + workflow step
    # below) bounds the fix loop.
    # NB: removed the `startsWith(issue.title, 'fix(') == false` filter that
    # was here. The intent had been to prevent fix-iteration from re-entering
    # on already-in-flight fix PRs, but the effect was to exclude EVERY
    # Conventional-Commits-named PR (all of our PRs start with `fix(` or
    # `feat(`). Observed concretely on PR #58 on 2026-05-13: VERDICT: BLOCK
    # landed, fix-iteration didn't fire, the head agent had to do the fix
    # manually. The re-entry concern is already handled by the Resolve PR
    # head ref step below — only PRs whose head branch starts with `impl/`
    # qualify, and the 3-attempt cap downstream bounds the loop.
    if: |
      github.event_name == 'issue_comment'
      && github.event.action == 'created'
      && github.event.issue.pull_request != null
      && github.event.comment.user.login == 'claude[bot]'
      && contains(github.event.comment.body, 'VERDICT: BLOCK')
      && (
        startsWith(github.event.issue.pull_request.html_url, 'https://github.com/jaetill/agentic-dev-environment/pull/')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Resolve PR head ref
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          # issue_comment events don't give us the PR head ref directly.
          # Fetch it via the API. Also fetch the head branch — must start
          # with impl/ to qualify as an implementer-authored PR.
          pr_json=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}")
          head_ref=$(echo "$pr_json" | jq -r '.head.ref')
          head_user=$(echo "$pr_json" | jq -r '.user.login')
          if [[ ! "$head_ref" == impl/* ]]; then
            echo "::notice::PR head '$head_ref' is not an implementer branch (no impl/ prefix); skipping fix-iteration."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$head_user" != "claude[bot]" ]]; then
            echo "::notice::PR author '$head_user' is not claude[bot]; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.pr.outputs.skip != 'true'
        with:
          fetch-depth: 0
          ref: ${{ steps.pr.outputs.head_ref }}
          # issue_comment trigger is attacker-reachable; keep lower-privilege
          # runtime token per security-review #323 (ADR-0041).
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Detect Node project
        id: detect
        if: steps.pr.outputs.skip != 'true'
        run: |
          if [ -f package.json ]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No root package.json — skipping Node setup."
          fi
      - uses: actions/setup-node@v4
        if: steps.pr.outputs.skip != 'true' && steps.detect.outputs.node == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.pr.outputs.skip != 'true' && steps.detect.outputs.node == 'true'
        run: |
          npm ci
          [ -f lambda/package-lock.json ] && npm ci --prefix lambda || echo "no lambda deps"
      - name: Configure git author
        if: steps.pr.outputs.skip != 'true'
        run: |
          git config user.name 'claude[bot]'
          git config user.email '41898282+claude[bot]@users.noreply.github.com'
      - name: Count prior fix attempts on this branch
        id: count
        if: steps.pr.outputs.skip != 'true'
        run: |
          attempts=$(git log --author='claude\[bot\]' --grep='address review feedback' --oneline | wc -l)
          echo "attempts=$attempts" >> "$GITHUB_OUTPUT"
          echo "Prior fix attempts: $attempts"
      - name: Escalate if at cap
        if: steps.pr.outputs.skip != 'true' && steps.count.outputs.attempts >= '3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh pr comment ${PR_NUMBER} --body "I've made 3 attempts to address review feedback without converging. Escalating to @jaetill for direction. Stopping autonomous fix iteration per ADR-0026."
          exit 0
      - name: Run implementer agent (Mode B — fix)
        if: steps.pr.outputs.skip != 'true' && steps.count.outputs.attempts < '3'
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          allowed_bots: 'claude[bot]'
          prompt: |
            Act as the `implementer` subagent.
            You are operating in **Mode B — fix iteration**.

            PR: #${{ github.event.issue.number }}
            Head branch: ${{ steps.pr.outputs.head_ref }}
            Prior attempts on this branch: ${{ steps.count.outputs.attempts }}

            Read the latest reviewer comments:
              gh pr view ${{ github.event.issue.number }} --json comments

            Look specifically for the most recent comments starting with
            `## Code Review` and `## Security Review`. Each enumerates
            findings with severity. Address every Critical and High
            finding; address Medium findings if they're easy to fix in
            scope.

            Process:
              1. For each finding, read the file/line cited.
              2. Apply a minimal fix.
              3. Run npm test to verify nothing regresses.
              4. Commit with message:
                 `fix(<component>): address review feedback — <description>`
              5. **Pre-flight conflict check** (per spec step 11, issue
                 #29; equally applies to Mode B per #43). Run
                 `git fetch origin master && git rebase origin/master`.
                 Clean rebase = continue. Conflict = `git rebase --abort`,
                 post an explanatory comment on the PR
                 (`gh pr comment ${PR_NUMBER} --body "..."`), and EXIT
                 WITHOUT PUSHING. The PR remains open; once the conflicting
                 master change has settled, the next reviewer-block
                 comment will re-trigger this job.
              6. Push to the same branch.
              7. Post a brief comment on the PR listing one bullet per
                 finding with what you changed.

            Hard rules same as Mode A.
          claude_args: |
            --model claude-sonnet-4-6
            --permission-mode bypassPermissions
            --allowed-tools Bash,Read,Write,Edit,Glob,Grep
            --append-system-prompt "Follow the platform standards in docs/standards/. You are operating in Mode B per .claude/agents/implementer.md."

  # ── workflow_dispatch handler — fleet promoter dispatch (ADR-0020) ──────
  manual-dispatch:
    if: |
      github.event_name == 'workflow_dispatch'
      && inputs.issue_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Inherit workflow-level perms. The agent's git push and PR creation
    # use a freshly-minted jaetill-ai-triage-team App installation token
    # (see the "Mint implementer App token" step). The App carries
    # `workflow` write at the install level, so scope:ci pushes succeed.
    # PRs created with this token are authored by `jaetill-ai-triage-team[bot]` —
    # a platform-enforced identity the auto-merger filter can trust (replacing
    # the prior commit-author-name approach that security-review #58/#349
    # flagged as spoofable). The legacy `IMPLEMENTER_PAT` path created PRs
    # authored by the PAT's owner (jaetill, a human), which both broke the
    # filter and required keeping the human-owned secret in rotation.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Mint implementer App token
        id: app-token
        # Pinned to SHA — this action receives FLEET_APP_PRIVATE_KEY (the
        # highest-value secret in the fleet) and the minted token carries
        # `workflow` write across all fleet repos. Tag overwrites on @v1
        # would silently rotate the action code under our private key
        # (security-review #351 High).
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Detect Node project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No root package.json — skipping Node setup."
          fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.node == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.detect.outputs.node == 'true'
        run: |
          npm ci
          [ -f lambda/package-lock.json ] && npm ci --prefix lambda || echo "no lambda deps"
      - name: Configure git author
        run: |
          git config user.name 'claude[bot]'
          git config user.email '41898282+claude[bot]@users.noreply.github.com'
      - name: Run implementer agent (manual dispatch)
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use the freshly-minted jaetill-ai-triage-team App token for all
          # GitHub operations the agent performs: git push (scope:ci edits
          # to .github/workflows/* need the install-level `workflow` perm
          # the App carries), gh CLI calls, and PR creation. PR author will
          # be `jaetill-ai-triage-team[bot]` — a platform-enforced identity
          # the auto-merger can filter on without spoofing risk (#58/#349).
          # Scoped to manual-dispatch only — Mode B (issue_comment) and
          # Mode C (cleanup-sweep) run on attacker-influenceable triggers
          # and keep the lower-privilege runtime token per security-review #323.
          github_token: ${{ steps.app-token.outputs.token }}
          # The fleet promoter (ADR-0020) dispatches this workflow as the
          # GitHub App jaetill-ai-triage-team[bot] — a Bot actor.
          # claude-code-action rejects Bot-initiated runs unless the bot is
          # allow-listed. workflow_dispatch is itself permission-gated, so
          # allowing the fleet App here is safe.
          allowed_bots: 'jaetill-ai-triage-team[bot]'
          show_full_output: true
          prompt: |
            Dispatched implementation (Mode A) — fleet promoter (ADR-0020)
            or manual smoke test. Issue number from the workflow_dispatch input.

            Issue number: ${{ inputs.issue_number }}
            Promoter-selected adjacent nits to bundle: ${{ inputs.bundle_issues }}

            Follow the Mode A process from .claude/agents/implementer.md.

            ADJACENCY BUNDLE (ADR-0029): the promoter pre-selected the nit
            issue(s) listed above (same-file matches). Do NOT scan the queue
            for nits yourself. For each supplied nit, confirm its cited file is
            one your change ACTUALLY touched; if so, bundle it into this PR's
            "While here" section and `Closes #<nit>`. If a supplied nit is NOT
            in a file you touched, DROP it: do not close it, leave it
            open at its severity (still a deferred nit), and — if you can determine the nit's
            actual current file from the code (e.g. a stale or renamed path) —
            edit that nit issue to correct its cited file:line so it is matched
            correctly next time; otherwise post a one-line note that it was
            evaluated with #${{ inputs.issue_number }} and was not adjacent.
          claude_args: |
            --model claude-sonnet-4-6
            --permission-mode bypassPermissions
            --allowed-tools Bash,Read,Write,Edit,Glob,Grep
            --append-system-prompt "Follow the platform standards in docs/standards/. Adhere strictly to .claude/agents/implementer.md."

  # ── Mode C: cleanup sweep (workflow_dispatch -f mode=cleanup-sweep) ──────
  # Dispatched by the fleet promoter's spare-capacity sweep (ADR-0020). No
  # originating issue — the implementer drains low/nit (severity:low,severity:nit) findings.
  cleanup-sweep:
    if: |
      github.event_name == 'workflow_dispatch'
      && inputs.mode == 'cleanup-sweep'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Cleanup-sweep operates on pre-existing PRs that may carry
          # attacker-influenced content; keep lower-privilege runtime token
          # per security-review #323 (ADR-0041).
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Detect Node project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No root package.json — skipping Node setup."
          fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.node == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.detect.outputs.node == 'true'
        run: |
          npm ci
          [ -f lambda/package-lock.json ] && npm ci --prefix lambda || echo "no lambda deps"
      - name: Configure git author
        run: |
          git config user.name 'claude[bot]'
          git config user.email '41898282+claude[bot]@users.noreply.github.com'
      - name: Run implementer agent (Mode C — cleanup sweep)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Dispatched by the fleet promoter App — allow the Bot actor
          # (full rationale on the workflow_dispatch handler above).
          allowed_bots: 'jaetill-ai-triage-team[bot]'
          show_full_output: true
          prompt: |
            Act as the `implementer` subagent, operating in **Mode C — cleanup
            sweep** (see .claude/agents/implementer.md).

            There is no originating issue. Open sidecar cleanup PR(s) only:
            drain a bounded batch of this repo's open low/nit issues
            (`severity:low,severity:nit`, excluding `ready-for-implementer`)
            — cap max(floor(total / 2), 8), chunked at 12 issues per
            PR. Branch `cleanup/deferred-sweep-<n>`; PR title
            `chore: drain deferred low/nit findings`. Each bundled fix must
            be bounded and unambiguous; skip any that is not. If there are no
            open low/nit issues, do nothing and exit.
          claude_args: |
            --model claude-sonnet-4-6
            --permission-mode bypassPermissions
            --allowed-tools Bash,Read,Write,Edit,Glob,Grep
            --append-system-prompt "Follow the platform standards in docs/standards/. Operate in Mode C cleanup-sweep per .claude/agents/implementer.md."
