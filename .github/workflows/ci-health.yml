name: ci-health
# CI-health watcher (ADR-0017 follow-up; widened to the fleet by ADR-0020).
#
# Watches workflow runs across the WHOLE fleet for failures that do not
# surface anywhere else. PR-triggered failures already show on the PR;
# event-triggered and scheduled workflows (claude-implementer, triage-scan,
# the claude-* agents) have no PR and no other watcher — a failure there can
# hide for days.
#
# DESIGN RULE: this workflow shares no failure mode with the things it
# watches. It has ZERO dependency on claude-code-action, npm, or any agent.
# It uses `gh`, bash, and exactly one GitHub-published action —
# `create-github-app-token` — to mint the cross-repo token (ADR-0020). That
# action is GitHub infrastructure, not part of the agent stack, so a failure
# in the watched loop cannot take this watcher down with it.
#
# On finding failures it does two things, so the signal lands regardless of
# whether the agent loop is healthy:
#   1. Files / updates a plain GitHub issue on the platform repo, labelled
#      `triage:medium` so the fleet promoter routes it to a fix (ADR-0020).
#   2. Exits non-zero, so the run goes red and GitHub notifies the owner.

on:
  schedule:
    # Daily at 13:00 UTC (~08:00 America/Chicago) — Jason sees it at the
    # start of his day.
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write    # file / update the CI-health issue here (fleet run-listing uses FLEET_TOKEN)

concurrency:
  group: ci-health-${{ github.repository }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out platform repo (for scripts/fleet-repos.sh)
        uses: actions/checkout@v4

      # Cross-repo credential — Actions:read across the fleet (ADR-0020).
      - name: Mint fleet App token
        id: fleet-token
        continue-on-error: true  # Allow degraded-mode scan when App credentials are unavailable
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Least privilege (#36): this watcher only calls `gh run list`
          # (Actions:read) with FLEET_TOKEN. Scope the minted token to
          # actions:read so it cannot carry the App's broader write scopes.
          permission-actions: read

      - name: Scan the fleet for non-PR workflow failures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLEET_TOKEN: ${{ steps.fleet-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # ~25h lookback — a little over the daily cadence so nothing slips
          # through at the boundary.
          since=$(date -u -d '25 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "Scanning fleet runs since $since"

          # Degraded mode: FLEET_TOKEN is empty when the App token minting
          # failed (continue-on-error above). In that case scope the scan to
          # the platform repo only and use the step-level GH_TOKEN directly —
          # never inline GH_TOKEN="" which relies on undocumented gh fallback.
          DEGRADED=0
          if [[ -z "$FLEET_TOKEN" ]]; then
            DEGRADED=1
            echo "::warning::ci-health: FLEET_TOKEN unavailable — degraded mode, scanning platform repo only"
          fi

          # The fleet — resolved from the committed manifest (fleet/repos.txt)
          # via scripts/fleet-repos.sh (ADR-0051), no hardcoded list. Resolution
          # reads a checked-out file (no cross-repo call), but the subsequent run
          # listing uses FLEET_TOKEN. FAIL CLOSED: an empty/unresolvable roster
          # must NOT be treated as "fleet healthy" — skip the scan cleanly so we
          # don't false-alarm (or false-all-clear) on a roster we couldn't read.
          # In degraded mode (no FLEET_TOKEN) we already scope to the platform
          # repo only, so the roster resolution is skipped there.
          FLEET=""
          if [[ "$DEGRADED" != "1" ]]; then
            FLEET="$(OWNER="$OWNER" GH_TOKEN="$FLEET_TOKEN" bash "$GITHUB_WORKSPACE/scripts/fleet-repos.sh")" || FLEET=""
            if [[ -z "${FLEET// }" ]]; then
              echo "::warning::ci-health: could not resolve fleet manifest roster — skipping scan this run (fail closed)."
              exit 0
            fi
          fi

          if [[ "$DEGRADED" == "1" ]]; then
            SCAN_REPOS="agentic-dev-environment"
          else
            SCAN_REPOS="$FLEET"
          fi

          # Collect qualifying failures.
          all='[]'
          for repo in $SCAN_REPOS; do
            if [[ "$repo" == "agentic-dev-environment" ]]; then
              # Platform repo: always use the step-level GH_TOKEN (GITHUB_TOKEN).
              # Do not override with FLEET_TOKEN — in degraded mode it is empty,
              # and GH_TOKEN="" triggers undocumented gh credential fallback.
              runs=$(gh run list --repo "$OWNER/$repo" \
                --status failure --limit 100 \
                --json workflowName,event,createdAt,url 2>/dev/null) || {
                echo "::warning::ci-health: could not list runs for $OWNER/$repo — treating as no failures"
                runs='[]'
              }
            else
              runs=$(GH_TOKEN="$FLEET_TOKEN" gh run list --repo "$OWNER/$repo" \
                --status failure --limit 100 \
                --json workflowName,event,createdAt,url 2>/dev/null) || {
                echo "::warning::ci-health: could not list runs for $OWNER/$repo (App token access, or repo missing) — treating as no failures"
                runs='[]'
              }
            fi
            # Keep: created in the window, NOT pull_request/push (those show
            # on the PR/commit already), and NOT this watcher itself.
            keep=$(echo "$runs" | jq --arg since "$since" --arg repo "$repo" '
              [ .[]
                | select(.createdAt >= $since)
                | select(.event != "pull_request" and .event != "push")
                | select(.workflowName != "ci-health")
                | . + {repo: $repo}
              ]')
            all=$(jq -n --argjson a "$all" --argjson b "$keep" '$a + $b')
          done

          count=$(echo "$all" | jq 'length')
          echo "Qualifying fleet failures: $count"

          title="CI health: fleet workflow failures"

          # Dedup by a STABLE label, not the title (#42): a title change would
          # break title-based dedup and re-file a duplicate on the next run.
          # Ensure the marker label exists, then match open issues by it.
          gh label create ci-health --color ededed \
            --description "CI-health watcher dedup marker" --force >/dev/null 2>&1 || true
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label "ci-health" --json number --jq '.[0].number // empty')

          if [[ "$count" -eq 0 ]]; then
            if [[ "$DEGRADED" == "1" ]]; then
              echo "::notice::CI health OK for platform repo — fleet scan incomplete (degraded mode, FLEET_TOKEN unavailable)."
              # Do NOT close the existing issue: we only checked one of eight repos.
            else
              echo "::notice::CI health OK — no non-PR workflow failures across the fleet in the last 25h."
              # Health recovered — close any open CI-health issue so the
              # watcher does not cry wolf forever.
              if [[ -n "$existing" ]]; then
                echo "Health recovered — closing CI-health issue #$existing"
                gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
                  --body "CI health recovered — no non-PR workflow failures across the fleet in the last 25h. Closing automatically; the watcher reopens a fresh issue if failures recur."
                gh issue close "$existing" --repo "$GITHUB_REPOSITORY"
              fi
            fi
            exit 0
          fi

          # Human-readable summary, grouped by repo.
          summary=$(echo "$all" | jq -r '
            group_by(.repo)[]
            | "### \(.[0].repo)",
              (.[] | "- **\(.workflowName)** (\(.event)) — \(.createdAt) — \(.url)"),
              ""')

          {
            if [[ "$DEGRADED" == "1" ]]; then
              echo "> [!WARNING]"
              echo "> **Degraded scan — platform repo only.** The fleet App token was unavailable; seven of eight fleet repos were not checked."
              echo ""
            fi
            echo "## CI health: fleet workflow failures detected"
            echo ""
            if [[ "$DEGRADED" == "1" ]]; then
              echo "The CI-health watcher found **$count** failed run(s) of"
              echo "event-triggered or scheduled workflows in the platform repo in the"
              echo "last 25 hours (degraded mode — fleet App token unavailable)."
            else
              echo "The CI-health watcher found **$count** failed run(s) of"
              echo "event-triggered or scheduled workflows across the fleet in the"
              echo "last 25 hours. These do not surface on any PR, so they are"
              echo "easy to miss."
            fi
            echo ""
            echo "$summary"
            echo "_Filed automatically by \`.github/workflows/ci-health.yml\`._"
            echo "_Labelled \`triage:medium\` so the fleet promoter routes it to a fix (ADR-0020)._"
            echo "_This issue updates in place; it is not re-filed each day._"
          } > /tmp/ci-health-body.md

          cat /tmp/ci-health-body.md

          if [[ -n "$existing" ]]; then
            echo "Updating existing CI-health issue #$existing"
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file /tmp/ci-health-body.md
          else
            echo "Filing new CI-health issue"
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --label "bug,triage:medium,ci-health" \
              --body-file /tmp/ci-health-body.md
          fi

          # Exit red so the run fails loudly and GitHub notifies the owner.
          echo "::error::CI health check failed — $count non-PR workflow failure(s). See the CI-health issue."
          exit 1
