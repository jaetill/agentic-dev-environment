name: release (reusable)
# REUSABLE (ADR-0018 / ADR-0010) — the single source of truth for release-please
# across the fleet. App repos invoke it via a thin `release.yml` caller that
# forwards `push: [master|main]` with `secrets: inherit`. To change release
# behaviour, edit THIS file only — do NOT inline it into projects (inlined
# copies are the drift this eliminates; see the 2026-06-05 release-PR incident).
#
# release-please reads conventional commits since the last tag and opens (or
# updates) a release PR with the CHANGELOG + version bump. Merging that PR cuts
# the GitHub release + tag, which triggers the deploy.
#
# WHY THE APP TOKEN: a release PR created with the default GITHUB_TOKEN cannot
# trigger other workflows (GitHub loop-prevention), so its required review
# checks NEVER run and the PR sits BLOCKED until a human close/reopens it — the
# recurring "release needs a close/reopen" toil. Minting a fleet GitHub App
# token makes the PR App-authored, whose pull_request event DOES fire the review
# gate. If the App secrets are absent the step fails soft and we fall back to
# GITHUB_TOKEN — callers without the secrets keep their prior behaviour (PR is
# created but check-less), so this is safe to land before secrets are
# provisioned. Provision per repo:
#   gh secret set FLEET_APP_ID         --repo jaetill/<repo> --body "<id>"
#   gh secret set FLEET_APP_PRIVATE_KEY --repo jaetill/<repo> < fleet-app.pem

on:
  workflow_call:
    inputs:
      release-type:
        type: string
        required: false
        default: node          # python | node | terraform-module
      config-file:
        type: string
        required: false
        default: .release-please-config.json
      manifest-file:
        type: string
        required: false
        default: .release-please-manifest.json
    # No `secrets:` block — callers use `secrets: inherit`, so this reusable can
    # read whatever secrets the caller repo has (FLEET_APP_*, CLAUDE_CODE_OAUTH_
    # TOKEN) and reference any that are absent as empty (handled by fallbacks).
    outputs:
      release_created:
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        value: ${{ jobs.release-please.outputs.tag_name }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: Mint fleet App token (so the release PR triggers checks)
        id: app-token
        uses: actions/create-github-app-token@v1
        continue-on-error: true   # absent secrets → fall back to GITHUB_TOKEN
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          release-type: ${{ inputs.release-type }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}

  # NOTE: release-captain review of the release PR runs via each app repo's
  # inline `.github/workflows/claude-release-captain.yml` on the
  # `pull_request` event — that's where the agent CAN act. The previous
  # in-reusable release-captain job (push-triggered via workflow_call)
  # called `anthropics/claude-code-action@v1` from a `push` event, which the
  # action rejects ("Unsupported event type: push"), so it failed on every
  # release fleet-wide. Removed 2026-06-06; per-repo inline workflow is the
  # path forward (ADR-0010 §3).
