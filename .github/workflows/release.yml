name: release (reusable)
# Per ADR-0010 — release-please opens release PRs; release-captain auto-merges.

on:
  workflow_call:
    inputs:
      release-type:
        type: string
        required: true   # python | node | terraform-module
    secrets:
      ANTHROPIC_API_KEY:
        required: true
    outputs:
      release_created:
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        value: ${{ jobs.release-please.outputs.tag_name }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  release-captain:
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run release-captain agent
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Act as the release-captain subagent defined in .claude/agents/release-captain.md.
            release-please opened or updated PR ${{ fromJson(needs.release-please.outputs.pr).number }}.
            Review the changelog, decide if narrative is warranted (per ADR-0010 §3 criteria),
            and auto-merge if all checks pass and no `release-block` label is applied.
          claude_args: |
            --model claude-haiku-4-5
            --append-system-prompt "Tier 1 routine work; escalate to Sonnet if narrative drafting is needed per ADR-0010."
