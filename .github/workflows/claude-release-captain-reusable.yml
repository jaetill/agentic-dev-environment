name: claude-release-captain (reusable)
# REUSABLE (ADR-0018 / ADR-0010 §7) — release-captain agent for release-please PRs.
# App repos invoke this via a thin `claude-release-captain.yml` caller that
# triggers on pull_request targeting main, filtered to release-please-- branches,
# with `secrets: inherit`. To change release-captain behaviour, edit THIS file only.
#
# WHY PER-REPO TRIGGER: the action rejects "push" event triggers; the release PR's
# pull_request event is where the agent can read the PR, check labels, and
# enable auto-merge. The old in-reusable release-captain job ran on push/
# workflow_call and failed fleet-wide. Removed 2026-06-06 (release.yml:76).

on:
  workflow_call:
    # ADR-0048: declare the consumed secret so callers scope it explicitly
    # instead of `secrets: inherit` (required:false keeps any inherit caller working).
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

permissions:
  contents: write        # auto-merge the release PR
  pull-requests: write   # post PR comments; enable auto-merge
  issues: write          # escalation: open anomaly issues
  id-token: write        # claude-code-action OIDC

jobs:
  release-captain:
    # Defence-in-depth: block non-release-please branches even if the caller's
    # if: guard is ever loosened (fixes #453).
    if: startsWith(github.event.pull_request.head.ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run release-captain agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          # Allow release-please bot (github-actions[bot]) and the fleet App that
          # may author the release PR (so checks trigger per ADR-0010 / release.yml).
          allowed_bots: 'github-actions[bot],jaetill-ai-triage-team[bot]'
          prompt: |
            Act as the release-captain subagent defined in
            plugins/ai-team/agents/release-captain.md (or .claude/agents/release-captain.md
            if present in this project).

            You are running on release PR #${{ github.event.pull_request.number }}
            (branch: ${{ github.head_ref }}).

            ## Process — Tier 1 (Haiku, routine)

            1. Read the release PR:
                 gh pr view ${{ github.event.pull_request.number }} --json title,body,labels,headRefName

            2. Check for `release-block` label. If present:
                 gh pr comment ${{ github.event.pull_request.number }} \
                   --body "release-captain: Auto-merge paused — \`release-block\` label is set. Remove the label to proceed."
               Then STOP. Do NOT merge.

            3. Read commits since the last tag to understand the release scope:
                 git log --oneline $(git describe --tags --abbrev=0 2>/dev/null || echo "")..HEAD 2>/dev/null \
                   || git log --oneline | head -30

            4. Determine the version bump type from the PR title (release-please titles
               "chore(main): release X.Y.Z") and the commit log.

            5. Decide if narrative is warranted (ADR-0010 §3):
               - Major version bump or BREAKING CHANGE → yes
               - 3+ feat: commits and changes are user-visible → yes
               - >2 weeks since last release with meaningful batch → sometimes
               - Patch with only fix: commits → no

            6. If narrative IS warranted:
               - Read the auto-generated changelog section in the PR body
               - Prepend a "## What this means for you" section (2–3 sentences,
                 user-focused, Keep a Changelog tone — no marketing, no jargon)
               - Update the PR body:
                   current=$(gh pr view ${{ github.event.pull_request.number }} --json body --jq '.body')
                   gh pr edit ${{ github.event.pull_request.number }} --body "$(echo "## What this means for you

            <your narrative here>

            ---

            ${current}")"

            7. Check for anomalies before merging:
               - Breaking change present but no migration guide → open an issue, STOP
               - Single trivial docs: commit only → comment and investigate, don't merge

            8. If all clear, enable auto-merge so GitHub merges when checks are green:
                 gh pr merge ${{ github.event.pull_request.number }} --squash --auto
               Post a status comment:
                 gh pr comment ${{ github.event.pull_request.number }} \
                   --body "release-captain: LGTM — auto-merge enabled. Will squash-merge when all checks pass."

            ## Hard rules
            - NEVER merge if `release-block` label is present.
            - NEVER edit CHANGELOG.md — it is auto-generated by release-please.
            - NEVER create tags manually.
            - Only operate on release-please branches (head starts with release-please--).
          claude_args: |
            --model claude-haiku-4-5-20251001
            --permission-mode bypassPermissions
            --allowed-tools Bash,Read,Glob,Grep
            --append-system-prompt "Follow the platform standards in docs/standards/. ADR-0010 §7 grants release-captain autonomous merge authority over release-please PRs."
